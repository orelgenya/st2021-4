              "Information",
              "Message Status Request",
              "Request",
              "Reply"
            ]
          },
          "OperationalModeType": {
            "type": "string",
            "enum": [
              "Normal",
              "JIP",
              "Expendable"
            ]
          },
          "OriginType": {
            "type": "string"
          },
          "QueryStringIdentifier": {
            "type": "string",
            "pattern": "[A-Z][a-zA-Z0-9]*(/[A-Z][a-zA-Z0-9]*)*(/\\*){0,1}"
          },
          "QueryString": {
            "type": "string",
            "pattern": "\\*"
          },
          "ScheduleEventType": {
            "type": "string",
            "enum": [
              "Primary",
              "NonPrimary",
              "Auxiliary",
              "Comment",
              "ProgramHeader",
              "BreakHeader",
              "Macro",
              "Data"
            ]
          },
          "ScheduleType": {
            "type": "string",
