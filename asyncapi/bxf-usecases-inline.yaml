              },
              "@parentTransferId": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@status": {
                "$ref": "#/components/schemas/contenttransfer/$defs/TransferStatusType"
              },
              "@statusDescription": {
                "type": "string"
              },
              "@percentComplete": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "@recordEventStart": {
                "type": "string",
                "format": "date-time"
              },
              "@recordEventEnd": {
                "type": "string",
                "format": "date-time"
              },
              "@dayPattern": {
                "$ref": "#/components/schemas/bxftypes/$defs/DayPattern"
              },
              "@jobId": {}
            },
            "additionalProperties": false,
            "description": "Transfer content from a source to a destination",
            "required": [
              "Content",
              "@transferId",
              "@transferType"
            ]
          },
          "TransferType": {
            "type": "string",
            "enum": [
              "Recording",
              "Duplication",
              "File transfer",
              "Purge"
            ]
          },
          "PriorityType": {
            "type": "string",
            "enum": [
              "Deferred",
              "Urgent",
              "High",
              "Normal",
              "Low"
            ]
          },
          "TransferStatusType": {
            "type": "string",
            "enum": [
              "Unknown",
              "Failed",
              "Completed",
              "Inprogress",
              "Pending"
            ]
          }
        },
        "additionalProperties": false
      },
      "contract": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/contract.schema.json",
        "title": "contract",
        "type": "object",
        "properties": {},
        "$defs": {
          "ProgramContract": {
            "type": "object",
            "properties": {
              "ContractId": {
                "title": "ContractId",
                "type": "integer",
                "minimum": 1,
                "description": "Reference value to identify the contract assigned by distributor or entity"
              },
              "Name": {
                "title": "Name",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Reference name associated to the contract by the entity"
              },
              "Distributor": {
                "title": "Distributor",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Owner or rights holder of the content"
              },
              "ContractStartDate": {
                "title": "ContractStartDate",
                "type": "string",
                "format": "date",
                "description": "Earliest date that any content under this contract can be used by the entity"
              },
              "ContractEndDate": {
                "title": "ContractEndDate",
                "type": "string",
                "format": "date",
                "description": "Last date that any content under this contract can be used by the entity"
              },
              "TotalTitleCost": {
                "title": "TotalTitleCost",
                "type": "number",
                "description": "A value associated with playing or using the content"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "required": [
              "ContractId"
            ]
          },
          "SalesContract": {
            "type": "object",
            "properties": {
              "ContractNumber": {
                "title": "ContractNumber",
                "type": "string",
                "minLength": 1,
                "maxLength": 255,
                "description": "Traffic system contract number related to this event"
              },
              "ContractStartDate": {
                "title": "ContractStartDate",
                "type": "string",
                "format": "date-time",
                "description": "Date before which content should not air"
              },
              "ContractEndDate": {
                "title": "ContractEndDate",
                "type": "string",
                "format": "date-time",
                "description": "Date after which content should not air"
              },
              "LineNumber": {
                "title": "LineNumber",
                "type": "integer",
                "minimum": 1,
                "description": "Traffic system contract line number related to this event"
              },
              "SpotNumber": {
                "title": "SpotNumber",
                "type": "integer",
                "minimum": 1,
                "description": "Traffic system spot serial number"
              },
              "Cost": {
                "title": "Cost",
                "type": "number",
                "description": "Cost of the spot per play (v3.0)"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false
          }
        },
        "additionalProperties": false
      },
      "datacontent": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/datacontent.schema.json",
        "title": "datacontent",
        "type": "object",
        "properties": {},
        "$defs": {
          "DataContent": {
            "type": "object",
            "properties": {
              "BitRate": {
                "title": "BitRate",
                "type": "integer",
                "minimum": 1
              },
              "FileName": {
                "title": "FileName",
                "type": "string",
                "minLength": 1,
                "maxLength": 255
              }
            },
            "additionalProperties": false,
            "required": [
              "BitRate",
              "FileName"
            ]
          },
          "VerticalIntervalData": {
            "type": "object",
            "description": "Used to indicate what data is embedded in the vertical interval of the video image",
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "VBIData": {
                    "title": "VBIData",
                    "type": "object",
                    "properties": {
                      "@fieldPolarity": {
                        "type": "string",
                        "enum": [
                          "Top",
                          "Bottom"
                        ]
                      },
                      "@lineOffSet": {
                        "type": "integer",
                        "minimum": 6,
                        "maximum": 22
                      },
                      "@waveForm": {
                        "type": "string",
                        "enum": [
                          "AMOL",
                          "TVGuide",
                          "VITC",
                          "VITS"
                        ]
                      }
                    },
                    "additionalProperties": false
                  }
                },
                "additionalProperties": false,
                "required": [
                  "VBIData"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "VANCData": {
                    "title": "VANCData",
                    "type": "object",
                    "properties": {
                      "@did": {
                        "type": "integer",
                        "minimum": 0
                      },
                      "@sdid": {
                        "type": "integer",
                        "minimum": 0
                      }
                    },
                    "additionalProperties": false,
                    "description": "See SMPTE 291M for appropriate values for attributes."
                  }
                },
                "additionalProperties": false,
                "required": [
                  "VANCData"
                ]
              }
            ]
          }
        },
        "additionalProperties": false
      },
      "element": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/element.schema.json",
        "title": "element",
        "type": "object",
        "properties": {},
        "$defs": {
          "Element": {
            "type": "object",
            "properties": {
              "SequenceNumber": {
                "title": "SequenceNumber",
                "type": "integer",
                "minimum": 1,
                "description": "Uniique order count that specifies the order of play of all elements within the show including program segments and embedded non-program elements"
              },
              "Description": {
                "title": "Description",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
              },
              "Offset": {
                "title": "Offset",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfSmpteTime",
                "description": "Offset from the start of the show"
              },
              "Duration": {
                "title": "Duration",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfDuration"
              },
              "OverlayOpportunity": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/element/$defs/OverlayOpportunityType"
                },
                "description": "Describes locations in time and space where overlays are either permitted or restricted from use. (v3.0)"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "ProgramElement": {
                    "title": "ProgramElement",
                    "$ref": "#/components/schemas/element/$defs/ProgramElement",
                    "description": "Description of individual show segments"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "ProgramElement"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "EmbeddedNonProgramContent": {
                    "title": "EmbeddedNonProgramContent",
                    "$ref": "#/components/schemas/nonprogramcontent/$defs/NonProgramContent",
                    "description": "Description of embedded non program elements such as barter spots"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "EmbeddedNonProgramContent"
                ]
              }
            ],
            "required": [
              "SequenceNumber",
              "Offset",
              "Duration"
            ]
          },
          "ProgramElement": {
            "type": "object",
            "properties": {
              "SegmentNumber": {
                "title": "SegmentNumber",
                "type": "integer",
                "description": "The order identifier for each segment"
              },
              "Type": {
                "title": "Type",
                "type": "object",
                "$ref": "#/components/schemas/element/$defs/ProgramContentType",
                "description": "Either a program segment or an interactive element. Textless added as a new otpion. (v6.0) Added Black, Bumper and Slate as new options. (v8.0)"
              },
              "ContentMetaData": {
                "title": "ContentMetaData",
                "$ref": "#/components/schemas/contentmetadata/$defs/ContentMetaData",
                "description": "For each element describes the content identifier and optionally additional details for the content"
              },
              "SegmentName": {
                "title": "SegmentName",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Each segment can have a descriptive name for the segment"
              },
              "OverlayOpportunity": {
                "title": "OverlayOpportunity",
                "$ref": "#/components/schemas/element/$defs/OverlayOpportunityType",
                "description": "Describes locations in time and space where overlays are either permitted or restricted from use. (v3.0)"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "description": "For each element this describes the content on the element",
            "required": [
              "SegmentNumber",
              "Type",
              "ContentMetaData"
            ]
          },
          "OverlayOpportunityType": {
            "type": "object",
            "properties": {
              "Video-Audio": {
                "title": "Video-Audio",
                "type": "string",
                "enum": [
                  "Video",
                  "Audio"
                ]
              },
              "SOM": {
                "title": "SOM",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfSmpteTime"
              },
              "EOM": {
                "title": "EOM",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfSmpteTime"
              },
              "OpportunityComment": {
                "type": "array",
                "items": {
                  "type": "string"
                }
              },
              "ScreenLocation": {
                "title": "ScreenLocation",
                "type": "object",
                "properties": {
                  "Plane": {
                    "title": "Plane",
                    "type": "object",
                    "properties": {
                      "@zOrder": {
                        "type": "integer",
                        "minimum": 1
                      },
                      "@percentOpaque": {
                        "type": "integer"
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "@zOrder",
                      "@percentOpaque"
                    ],
                    "description": "Defines the layer when multiple overlays are allowed."
                  },
                  "TopCorner": {
                    "title": "TopCorner",
                    "type": "object",
                    "properties": {
                      "@horizontalCoordinate": {
                        "type": "integer",
                        "minimum": 0
                      },
                      "@verticalCoordinate": {
                        "type": "integer",
                        "minimum": 0
                      },
                      "@units": {
                        "type": "string",
                        "enum": [
                          "Centimeters",
                          "Inches",
                          "Percent of Screen",
                          "Pixels"
                        ]
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "@horizontalCoordinate",
                      "@verticalCoordinate"
                    ],
                    "description": "Upper left corner definition of the overlay position relative to the upper left corner of the screen."
                  },
                  "Size": {
                    "title": "Size",
                    "type": "object",
                    "properties": {
                      "@width": {
                        "type": "integer",
                        "minimum": 1
                      },
                      "@height": {
                        "type": "integer",
                        "minimum": 1
                      },
                      "@units": {
                        "type": "string",
                        "enum": [
                          "Centimeters",
                          "Inches",
                          "Percent of Screen",
                          "Pixels"
                        ]
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "@width",
                      "@height"
                    ],
                    "description": "The offset from the TopCorner using the same units"
                  },
                  "@interactivity": {
                    "type": "boolean"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "Plane",
                  "TopCorner",
                  "Size"
                ],
                "description": "Defines the location of one or more video overlays on the screen and if it is interactive."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              },
              "@allow": {
                "type": "boolean"
              },
              "@opportunityType": {
                "type": "string"
              }
            },
            "additionalProperties": false,
            "description": "Describes locations in time and space where overlays are either permitted or restricted from use. (v3.0)",
            "required": [
              "Video-Audio",
              "SOM",
              "EOM"
            ]
          },
          "ProgramContentType": {
            "type": "string",
            "enum": [
              "Black",
              "Bumper",
              "Interactive",
              "LocalBreak",
              "ProgramSegment",
              "Slate",
              "Textless"
            ]
          }
        },
        "additionalProperties": false
      },
      "eventdata": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/eventdata.schema.json",
        "title": "eventdata",
        "type": "object",
        "properties": {},
        "$defs": {
          "SCTE-35DistributionRestrictions": {
            "type": "object",
            "properties": {
              "@deliveryNotRestricted": {
                "type": "boolean"
              },
              "@webDeliveryAllowed": {
                "type": "boolean"
              },
              "@noRegionalBlackout": {
                "type": "boolean"
              },
              "@archiveAllowed": {
                "type": "boolean"
              },
              "@deviceRestrictions": {
                "type": "array",
                "items": {
                  "type": "string",
                  "enum": [
                    "Group0",
                    "Group1",
                    "Group2",
                    "None"
                  ]
                }
              }
            },
            "additionalProperties": false,
            "description": "Accommodates the 2012 revision to SCTE-35 that adds distribution bits. (v3.0)"
          },
          "EventExtId": {
            "type": "object",
            "properties": {
              "BillingReferenceCode": {
                "title": "BillingReferenceCode",
                "type": "string",
                "minLength": 1,
                "maxLength": 255,
                "description": "Used to link an event back to its billing record"
              }
            },
            "additionalProperties": false,
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "Null": {
                    "title": "Null",
                    "type": "object"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "Null"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "EventId": {
                    "title": "EventId",
                    "$ref": "#/components/schemas/bxftypes/$defs/Uuid",
                    "description": "Unique within a schedule reference for each event required to be a UUID."
                  }
                },
                "additionalProperties": false,
                "required": [
                  "EventId"
                ]
              }
            ]
          },
          "EventData": {
            "type": "object",
            "properties": {
              "EventId": {
                "title": "EventId",
                "$ref": "#/components/schemas/eventdata/$defs/EventExtId",
                "description": "Unique identifier for each event"
              },
              "EventTitle": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                }
              },
              "InsertAfterEventId": {
                "title": "InsertAfterEventId",
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid",
                "description": "A pointer to the event prior to the position used to insert a new event in an existing list.  Required to be a UUID."
              },
              "StartDateTime": {
                "title": "StartDateTime",
                "type": "object",
                "properties": {
                  "@nominalFlag": {}
                },
                "additionalProperties": false,
                "allOf": [
                  {
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfDateTime"
                  }
                ],
                "required": [],
                "description": "The date and time of the beginning of the event"
              },
              "LengthOption": {
                "title": "LengthOption",
                "type": "object",
                "oneOf": [
                  {
                    "type": "object",
                    "properties": {
                      "Duration": {
                        "title": "Duration",
                        "type": "object",
                        "properties": {
                          "EstimatedDurationOffset": {
                            "type": "array",
                            "items": {
                              "type": "integer",
                              "minimum": 0
                            },
                            "maxItems": 2,
                            "description": "Used to indicate the amount of time in plus or minus total minutes that the duration may be adjusted"
                          },
                          "@nominalFlag": {
                            "type": "boolean"
                          }
                        },
                        "additionalProperties": false,
                        "allOf": [
                          {
                            "$ref": "#/components/schemas/bxftypes/$defs/BxfDuration"
                          }
                        ],
                        "required": []
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "Duration"
                    ]
                  },
                  {
                    "type": "object",
                    "properties": {
                      "EndDateTime": {
                        "title": "EndDateTime",
                        "type": "object",
                        "properties": {
                          "EstimatedDurationOffset": {
                            "type": "array",
                            "items": {
                              "type": "integer",
                              "minimum": 0
                            },
                            "maxItems": 2,
                            "description": "Used to indicate the amount of time in plus or minus total minutes that the end time may be adjusted"
                          },
                          "@nominalFlag": {
                            "type": "boolean"
                          }
                        },
                        "additionalProperties": false,
                        "allOf": [
                          {
                            "$ref": "#/components/schemas/bxftypes/$defs/BxfDateTime"
                          }
                        ],
                        "required": []
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "EndDateTime"
                    ]
                  }
                ],
                "description": "Duration or end time of the event"
              },
              "StartMode": {
                "title": "StartMode",
                "$ref": "#/components/schemas/bxftypes/$defs/StartModeType",
                "description": "The way the event will start relative to the previous event or time"
              },
              "EndMode": {
                "title": "EndMode",
                "$ref": "#/components/schemas/bxftypes/$defs/EndModeType",
                "description": "The way an event will end relative to its duration or other events"
              },
              "Transitions": {
                "title": "Transitions",
                "type": "object",
                "properties": {
                  "AudioTransitions": {
                    "type": "array",
                    "items": {
                      "$ref": "#/components/schemas/audio/$defs/AudioTransition"
                    }
                  },
                  "VideoTransitions": {
                    "title": "VideoTransitions",
                    "$ref": "#/components/schemas/video/$defs/VideoTransition"
                  }
                },
                "additionalProperties": false
              },
              "FederalId": {
                "title": "FederalId",
                "type": "string",
                "minLength": 1,
                "maxLength": 255,
                "description": "Some countries require a content identifier to be attached to indicate that the content has been cleared or reviewed."
              },
              "FederalSource": {
                "title": "FederalSource",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Some countries require an indication as to the original source of the content being aired.  The values will vary by country.  Examples are live, prerecorded, network, syndicated.  (See Configuration Section in BXF Protocol Documentation)"
              },
              "FederalType": {
                "title": "FederalType",
                "type": "string",
                "minLength": 1,
                "maxLength": 255,
                "description": "Some countries require further codification of the content such as the FCC Type or CRTC Code.  This is typically a specialized value limited by the countries regulatory body. (e.g. CM, PR, PSA, PRO, PRC) (See Configuration Section in BXF Protocol Documentation) (v3.0)"
              },
              "EventDescription": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                },
                "description": "Description of the event"
              },
              "EventNotes": {
                "title": "EventNotes",
                "$ref": "#/components/schemas/bxftypes/$defs/EventNotes",
                "description": "Operator notes used to annotate the event with reference to the person that created the note."
              },
              "JipFlag": {
                "title": "JipFlag",
                "type": "boolean",
                "description": "If the event is joined in progress set to true"
              },
              "Expendable": {
                "title": "Expendable",
                "type": "boolean",
                "description": "If event can be preempted then set to true"
              },
              "Protection": {
                "title": "Protection",
                "type": "object",
                "properties": {
                  "ProtectionSourceRequested": {
                    "title": "ProtectionSourceRequested",
                    "type": "boolean",
                    "description": "If set to true then type is required.  Default is false.  Indicates that the event should have a protected source (ie backup) that can be used if the primary source is unavailable or fails."
                  },
                  "ProtectionSourceName": {
                    "title": "ProtectionSourceName",
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 255,
                    "description": "Name of the type of protection source to be used.  This must be configured within the system. (See Configuration Section in BXF Protocol Documentation)"
                  },
                  "SCTE-35DistributionRestrictions": {
                    "title": "SCTE-35DistributionRestrictions",
                    "type": "object",
                    "properties": {
                      "@tierLevel": {
                        "type": "integer",
                        "minimum": 0,
                        "maximum": 4096
                      }
                    },
                    "additionalProperties": false,
                    "allOf": [
                      {
                        "$ref": "#/components/schemas/eventdata/$defs/SCTE-35DistributionRestrictions"
                      }
                    ],
                    "required": [],
                    "description": "Accommodates the 2012 revision to SCTE-35 that adds distribution bits. (v3.0)"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "ProtectionSourceRequested"
                ]
              },
              "AlternateEvent": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/eventdata/$defs/EventData"
                },
                "description": "Allow the linkage to standby promo content or other content that are backups or alternatives to content that may be missing at airtime."
              },
              "Series": {
                "title": "Series",
                "type": "string",
                "description": "If the content is part of a series this allows the entry of the episodic information"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              },
              "@eventType": {
                "type": "string",
                "enum": [
                  "Primary",
                  "Primary-ProgramHeader",
                  "Primary-BreakHeader",
                  "NonPrimary",
                  "Comment",
                  "Macro"
                ]
              }
            },
            "additionalProperties": false,
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "PrimaryEvent": {
                    "title": "PrimaryEvent",
                    "$ref": "#/components/schemas/primaryevent/$defs/PrimaryEvent"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "PrimaryEvent"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "NonPrimaryEvent": {
                    "title": "NonPrimaryEvent",
                    "$ref": "#/components/schemas/nonprimaryevent/$defs/NonPrimaryEvent"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "NonPrimaryEvent"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "MacroEvent": {
                    "title": "MacroEvent",
                    "$ref": "#/components/schemas/macro/$defs/Macro"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "MacroEvent"
                ]
              }
            ],
            "required": [
              "EventId",
              "StartDateTime",
              "LengthOption",
              "StartMode",
              "EndMode"
            ]
          }
        },
        "additionalProperties": false
      },
      "format": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/format.schema.json",
        "title": "format",
        "type": "object",
        "properties": {},
        "$defs": {
          "Format": {
            "type": "object",
            "properties": {
              "FormatId": {
                "title": "FormatId",
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid",
                "description": "The unique identifier for a format"
              },
              "FormatLength": {
                "title": "FormatLength",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfDuration",
                "description": "The duration of the complete format"
              },
              "FormatName": {
                "title": "FormatName",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "A human readable name for the format"
              },
              "FormatNotes": {
                "title": "FormatNotes",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Additional descriptive information about the format"
              },
              "FormatUsage": {
                "title": "FormatUsage",
                "$ref": "#/components/schemas/format/$defs/FormatUsage",
                "description": "Describes which channels and what dates a format can be used"
              },
              "FormatStructure": {
                "title": "FormatStructure",
                "type": "object",
                "properties": {
                  "FormatElements": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "PrimaryElementId": {
                          "title": "PrimaryElementId",
                          "$ref": "#/components/schemas/bxftypes/$defs/Uuid",
                          "description": "A UUID representing a unique identifier for this element"
                        },
                        "FormatElementType": {
                          "title": "FormatElementType",
                          "type": "string",
                          "enum": [
                            "Break",
                            "Comment",
                            "ID",
                            "Non-commercial Break",
                            "Segment"
                          ],
                          "description": "The type of strucutre for the element such as segment or break"
                        },
                        "FormatOrderSequence": {
                          "title": "FormatOrderSequence",
                          "type": "integer",
                          "minimum": 1,
                          "description": "Indicates the order of each of the format elements (allows placement of comments without indicating an offset time)."
                        },
                        "AvailNumber": {
                          "title": "AvailNumber",
                          "type": "integer",
                          "minimum": 1,
                          "description": "Indicates the position of a break element inside the format structure."
                        },
                        "TotalAvails": {
                          "title": "TotalAvails",
                          "type": "integer",
                          "minimum": 1,
                          "description": "Indicates the total number of break elements inside the format structure"
                        },
                        "AuthorizationList": {
                          "title": "AuthorizationList",
                          "type": "object",
                          "properties": {
                            "AuthorizedName": {
                              "type": "array",
                              "items": {
                                "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                              },
                              "minItems": 1
                            }
                          },
                          "additionalProperties": false,
                          "required": [
                            "AuthorizedName"
                          ],
                          "description": "Locations that are allowed to use the avail."
                        },
                        "IgnoreAvail": {
                          "title": "IgnoreAvail",
                          "type": "boolean",
                          "description": "Describes those avails that can be ignored during playback by certain locations"
                        },
                        "PrivateInformation": {
                          "title": "PrivateInformation",
                          "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
                        }
                      },
                      "additionalProperties": false,
                      "oneOf": [
                        {
                          "type": "object",
                          "properties": {
                            "Description": {
                              "title": "Description",
                              "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                              "description": "If the FormatElementType is a Comment then this field is required"
                            }
                          },
                          "additionalProperties": false,
                          "required": [
                            "Description"
                          ]
                        }
                      ],
                      "required": [
                        "PrimaryElementId",
                        "FormatElementType"
                      ]
                    },
                    "minItems": 1
                  }
                },
                "additionalProperties": false,
                "required": [
                  "FormatElements"
                ],
                "description": "A detailed definition of each of the individual elements of the format that include segments, breaks, secondary events and comments."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "required": [
              "FormatId",
              "FormatLength"
            ]
          },
          "FormatSubElements": {
            "type": "object",
            "properties": {
              "SubElementID": {
                "title": "SubElementID",
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid",
                "description": "UUID identfier for the structure."
              },
              "SubElementSequence": {
                "title": "SubElementSequence",
                "type": "integer",
                "description": "The ordinal sequence of each element with in the substructure."
              },
              "SubElementType": {
                "title": "SubElementType",
                "type": "string",
                "description": "The type of element as defined in Configuration that is acceptable within the substructure.  Typically strings such as National, Local, but can be any unique definition for the element."
              },
              "SubElementDuration": {
                "title": "SubElementDuration",
                "type": "object",
                "properties": {
                  "@variable": {}
                },
                "additionalProperties": false,
                "allOf": [
                  {
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfDuration"
                  }
                ],
                "required": [],
                "description": "The expected duration of the subelement."
              },
              "SubElementCode": {
                "title": "SubElementCode",
                "type": "string",
                "description": "A string that defines the type of element or localized code for that element."
              },
              "SubElementName": {
                "title": "SubElementName",
                "type": "string",
                "description": "An optional name for the subelement."
              },
              "SubElementCategory": {
                "title": "SubElementCategory",
                "type": "string",
                "description": "An optional category as defined in Configuration or elsewhere which allows the grouping of the subelements."
              },
              "NonPrimaryElements": {
                "title": "NonPrimaryElements",
                "$ref": "#/components/schemas/format/$defs/NonPrimaryElements",
                "description": "It is possible to add secondary events to a subelement such that one or more events occur at the same time or in overlapping sequence."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "description": "Used to subdivide a format element into smaller structures which when summed in duration would equal the total of the item.",
            "required": [
              "SubElementID",
              "SubElementSequence",
              "SubElementType",
              "SubElementDuration"
            ]
          },
          "FormatUsage": {
            "type": "object",
            "properties": {
              "AllowedChannels": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/bxftypes/$defs/BxfShortName"
                },
                "minItems": 1,
                "description": "Channels that a format can be used on"
              },
              "EmbargoDate": {
                "title": "EmbargoDate",
                "type": "string",
                "format": "date",
                "description": "First date the format can be used"
              },
              "ExpirationDate": {
                "title": "ExpirationDate",
                "type": "string",
                "format": "date",
                "description": "Last date the format can be used"
              },
              "Exclusions": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/bxftypes/$defs/BxfExtensions"
                },
                "description": "Allows unlimited defined values to be excluded as part of the FormatUsage. (v3.0)"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "description": "Describes for a format which channels it can be used on",
            "required": [
              "AllowedChannels"
            ]
          },
          "NonPrimaryElements": {
            "type": "object",
            "properties": {
              "NonPrimaryElementId": {
                "title": "NonPrimaryElementId",
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid",
                "description": "A UUID representing a unique identification of the element"
              },
              "NonPrimaryOffset": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "OffsetTime": {
                      "title": "OffsetTime",
                      "$ref": "#/components/schemas/bxftypes/$defs/BxfSmpteTime",
                      "description": "The time to start the event relative to the start time of the primary event"
                    },
                    "@OffsetFrom": {
                      "type": "string",
                      "enum": [
                        "BeginningofEvent",
                        "EndofEvent"
                      ]
                    },
                    "@OffsetType": {
                      "type": "string",
                      "enum": [
                        "Start",
                        "End"
                      ]
                    },
                    "@Direction": {
                      "type": "string",
                      "enum": [
                        "Positive",
                        "Negative"
                      ]
                    }
                  },
                  "additionalProperties": false
                },
                "minItems": 1,
                "maxItems": 2,
                "description": "The definition of how a non-primary event should run relative to the primary event either using the start or end points of either event."
              },
              "NonPrimaryDuration": {
                "title": "NonPrimaryDuration",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfDuration"
              },
              "NonPrimaryDescription": {
                "title": "NonPrimaryDescription",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
              },
              "Macros": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/macro/$defs/Macro"
                }
              },
              "PrimaryElementId": {
                "title": "PrimaryElementId",
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid",
                "description": "Used to establish a direct linkage to the Primary Element"
              }
            },
            "additionalProperties": false,
            "description": "It is possible to add secondary events to a primary event such that one or more events occur at the same time or in overlapping sequence.",
            "required": [
              "NonPrimaryElementId",
              "NonPrimaryOffset",
              "NonPrimaryDuration"
            ]
          }
        },
        "additionalProperties": false
      },
      "jobdetail": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/jobdetail.schema.json",
        "title": "jobdetail",
        "type": "object",
        "properties": {},
        "$defs": {
          "InstructionMap": {
            "type": "object",
            "properties": {
              "@jobInstructionId": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@contentMapId": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@stationId": {
                "type": "string"
              },
              "@instructionId": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              }
            },
            "additionalProperties": false,
            "description": "Used to map stations, content and traffic instructions in a many to many relationship. (v3.0)",
            "required": [
              "@jobInstructionId",
              "@contentMapId",
              "@stationId",
              "@instructionId"
            ]
          },
          "TrafficInstructions": {
            "type": "object",
            "properties": {
              "Content": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "@contentMapId": {
                      "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
                    },
                    "@contentVideoFormat": {
                      "type": "string",
                      "enum": [
                        "SD",
                        "HD",
                        "3D",
                        "2K",
                        "4K",
                        "Other"
                      ]
                    }
                  },
                  "additionalProperties": false,
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/content/$defs/Content"
                    }
                  ],
                  "required": [
                    "@contentMapId"
                  ]
                },
                "minItems": 1,
                "description": "Used to describe the content at a specific location"
              },
              "InstructionDetail": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/jobdetail/$defs/InstructionDetail"
                },
                "minItems": 1,
                "description": "Used to provide specific copy instructions for the content"
              },
              "InstructionMap": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/jobdetail/$defs/InstructionMap"
                },
                "minItems": 1,
                "description": "Maps the job, content, station and instructions allowing many to many relationships to be created.  If only one of each entity, this is still required."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "description": "Used to describe traffic instructions to a single or multiple stations for multiple content.  Requires stations to be defined under a Job. (v3.0)",
            "required": [
              "Content",
              "InstructionDetail",
              "InstructionMap"
            ]
          },
          "InstructionDetail": {
            "type": "object",
            "properties": {
              "PlacementMethod": {
                "title": "PlacementMethod",
                "type": "object",
                "properties": {
                  "NPCSchedule": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "@contentMapId": {},
                        "@comments": {
                          "type": "string"
                        }
                      },
                      "additionalProperties": false,
                      "oneOf": [
                        {
                          "type": "object",
                          "properties": {
                            "Dayparts": {
                              "type": "array",
                              "items": {
                                "type": "object",
                                "properties": {
                                  "Programs": {
                                    "type": "array",
                                    "items": {
                                      "type": "object",
                                      "properties": {
                                        "@excludeFlag": {
                                          "type": "boolean"
                                        }
                                      },
                                      "additionalProperties": false,
                                      "allOf": [
                                        {
                                          "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                                        }
                                      ],
                                      "required": []
                                    },
                                    "description": "Option to list programs that would normally be excluded or included wuthin the description of the dayparts. (E.g. run in Primetime, but not in a specific news programs)."
                                  }
                                },
                                "additionalProperties": false,
                                "allOf": [
                                  {
                                    "$ref": "#/components/schemas/bxftypes/$defs/BxfDaypart"
                                  }
                                ],
                                "required": []
                              },
                              "minItems": 1,
                              "description": "Time periods defined by days of the week and start and end times that either include or exclude the placement of the spot"
                            }
                          },
                          "additionalProperties": false,
                          "required": [
                            "Dayparts"
                          ]
                        },
                        {
                          "type": "object",
                          "properties": {
                            "NamedRule": {
                              "type": "array",
                              "items": {
                                "type": "string"
                              },
                              "minItems": 1,
                              "description": "Used to pass a defined named rule for placement of content that is agreed to by both parties.  For example, a predefined rule like \"ROS\" to indicate run of schedule on the station."
                            }
                          },
                          "additionalProperties": false,
                          "required": [
                            "NamedRule"
                          ]
                        }
                      ]
                    },
                    "description": "NonProgramContent placement rules that either specify or restrict where a spot can be placed by time periods or specifically named programs"
                  },
                  "PrivateInformation": {
                    "title": "PrivateInformation",
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
                  }
                },
                "additionalProperties": false,
                "description": "Rules concerning the placement of NPC onto a linear schedule at a specific distribution location, station, network, or other operator"
              },
              "ContentRotation": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "Frequency": {
                      "title": "Frequency",
                      "type": "integer",
                      "description": "Number of times the NPC can be aired in the flight period"
                    },
                    "RotationPercentage": {
                      "title": "RotationPercentage",
                      "type": "integer",
                      "minimum": 0,
                      "maximum": 100,
                      "description": "If multiple NPC records, use this to designate the rotation percentage"
                    },
                    "RotationPattern": {
                      "title": "RotationPattern",
                      "type": "string",
                      "description": "String of numbers (11223) or letters (ABBC) (with commas optionally) indicating content order of placement by traffic system. (Annotaion Only v8.0)"
                    },
                    "RotationSequence": {
                      "title": "RotationSequence",
                      "type": "integer",
                      "description": "If multiple NPC records, use this to designate the rotation sequence"
                    },
                    "RotationGroup": {
                      "title": "RotationGroup",
                      "type": "integer",
                      "description": "Used to group Bookends and Piggybacks. (v8.0)"
                    },
                    "@contentMapId": {}
                  },
                  "additionalProperties": false
                }
              },
              "DRCallToAction": {
                "title": "DRCallToAction",
                "type": "object",
                "properties": {
                  "DRCallToActionType": {
                    "title": "DRCallToActionType",
                    "type": "string",
                    "enum": [
                      "Phone Number",
                      "URL",
                      "SMS",
                      "Address",
                      "Other"
                    ],
                    "description": "Select a type from valid enumerations such Phone Number, URL, SMS, etc."
                  },
                  "DRCallToActionValue": {
                    "title": "DRCallToActionValue",
                    "type": "string",
                    "description": "Place actual value as a string in this field."
                  }
                },
                "additionalProperties": false,
                "required": [
                  "DRCallToActionType",
                  "DRCallToActionValue"
                ],
                "description": "Direct Response Information"
              },
              "Disposal": {
                "title": "Disposal",
                "type": "string",
                "description": "Instructions on the disposal of the NPC media once the contract period has ended"
              },
              "InstructionComments": {
                "title": "InstructionComments",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Specific comments concerning the instructions for the placement or use of the NPC on a schedule"
              },
              "AgencyDisclaimer": {
                "title": "AgencyDisclaimer",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Legal disclaimer provided by the buying agency that notifies the entity executing this contract of various limitations or other issues concerning the airing of the NPC material."
              },
              "BuyingSystemDetails": {
                "title": "BuyingSystemDetails",
                "type": "object",
                "properties": {
                  "TargetDayparts": {
                    "type": "array",
                    "items": {
                      "$ref": "#/components/schemas/bxftypes/$defs/BxfDaypart"
                    },
                    "description": "Dayparts that are targeted for the purposes of this buy, but are not specifically purchased as part of the contract."
                  },
                  "TargetPrograms": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    },
                    "description": "Programs targeted for the purpose of this buy, but are not specifically purchased as part of the contract."
                  },
                  "TargetCost": {
                    "title": "TargetCost",
                    "type": "number",
                    "description": "An estimate of the average cost expected for the buy."
                  },
                  "DistributionDate": {
                    "title": "DistributionDate",
                    "type": "string",
                    "format": "date",
                    "description": "The date that the NPC media is expected to have been received by the entity airing the copy for this buy."
                  }
                },
                "additionalProperties": false,
                "description": "Specific items that are referenced in the buying system, but are not part of the traffic instructions."
              },
              "InstructionFiles": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "@fileName": {
                      "type": "string"
                    }
                  },
                  "additionalProperties": false,
                  "required": []
                },
                "description": "Location to embed actual data files that would typically consist of the documentation for the traffic department to execute these instructions.  Can also be used to distribute small media files such as graphics and audio files, but not to be used for video."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              },
              "@actionType": {
                "type": "string",
                "enum": [
                  "Add",
                  "Delete",
                  "Revision",
                  "Unchanged"
                ]
              },
              "@instructionId": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@stationId": {
                "type": "string"
              }
            },
            "additionalProperties": false,
            "description": "Rules limiting where the NonProgramContent (NPC) can be used on a schedule. (v3.0)",
            "required": [
              "@actionType",
              "@instructionId"
            ]
          },
          "JobDetail": {
            "type": "object",
            "properties": {
              "JobType": {
                "title": "JobType",
                "type": "string",
                "description": "Type of job to be performed.  This is a specific list that the receiver of the message understands and can act on and would normally also be delineated in Configuration."
              },
              "JobRequester": {
                "title": "JobRequester",
                "type": "object",
                "properties": {
                  "AdditionalCompany": {
                    "type": "array",
                    "items": {
                      "$ref": "#/components/schemas/bxftypes/$defs/BxfCompany"
                    },
                    "minItems": 1
                  }
                },
                "additionalProperties": false,
                "allOf": [
                  {
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfCompany"
                  }
                ],
                "required": [
                  "AdditionalCompany"
                ],
                "description": "Company or person requesting the job to be performed"
              },
              "JobManager": {
                "title": "JobManager",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfCompany",
                "description": "Company or person managing, commissioning or coordinating the work across multiple companies."
              },
              "JobPerformers": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "Station": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "allOf": [
                          {
                            "$ref": "#/components/schemas/bxftypes/$defs/BxfStation"
                          }
                        ]
                      },
                      "minItems": 1,
                      "description": "The entities that will perform the job"
                    },
                    "JobResults": {
                      "title": "JobResults",
                      "type": "object",
                      "properties": {
                        "Accepted": {
                          "title": "Accepted",
                          "type": "boolean",
                          "description": "A flag to indicate that the job sent to the Performer has been accepted and either has been worked on or will be worked on.  If the flag is negated it indicates the job was rejected and will not be performed."
                        },
                        "UserName": {
                          "title": "UserName",
                          "type": "string",
                          "description": "The user that was associated with the decision to accept or reject a job at the Performer company.  Usually linked to a specific user in the Performer's system."
                        },
                        "UserComment": {
                          "title": "UserComment",
                          "type": "string",
                          "description": "An optional comment to indicate what was done with a job."
                        },
                        "PrivateInformation": {
                          "title": "PrivateInformation",
                          "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
                        }
                      },
                      "additionalProperties": false,
                      "required": [
                        "Accepted",
                        "UserName"
                      ],
                      "description": "Once the Performer works on a submitted job the results of that work would be available to indicate to the JobRequester and JobManager the status of the specific job, either accepted and performed or rejected."
                    },
                    "@stationCount": {
                      "type": "integer",
                      "minimum": 1
                    }
                  },
                  "additionalProperties": false,
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/bxftypes/$defs/BxfCompany"
                    }
                  ],
                  "required": [
                    "Station"
                  ]
                },
                "description": "The company that actually performs the work"
              },
              "JobInstruction": {
                "title": "JobInstruction",
                "type": "object",
                "properties": {
                  "JobReference": {
                    "title": "JobReference",
                    "type": "object",
                    "properties": {
                      "ReferenceType": {
                        "title": "ReferenceType",
                        "type": "string",
                        "description": "The type of reference being provided which can be designated in Configuration."
                      },
                      "ReferenceName": {
                        "title": "ReferenceName",
                        "type": "string"
                      },
                      "ReferenceCode": {
                        "title": "ReferenceCode",
                        "type": "string"
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "ReferenceType",
                      "ReferenceName"
                    ],
                    "description": "Used to provide JobPerformer with additional information to lookup a specific job related to a separate ordering process (e.g. Advertiser Name/Estimate Number could be provided to help look up a specific order in a traffic system)."
                  },
                  "Disclaimer": {
                    "title": "Disclaimer",
                    "type": "object",
                    "description": "Disclaimer that applies to all instuctions associated to the job.  For example, if the job is for a single agency, but has multiple Traffic Instructions this can be used to inert the Agency's Disclaimer once rather than having to repeat it at the lower level."
                  },
                  "InstructionComment": {
                    "title": "InstructionComment",
                    "type": "string",
                    "description": "Comments for the full instructions"
                  },
                  "PrivateInformation": {
                    "title": "PrivateInformation",
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
                  },
                  "@jobInstructionId": {
                    "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
                  },
                  "@instructionType": {
                    "type": "string"
                  },
                  "@instructionStartDate": {
                    "type": "string",
                    "format": "date"
                  },
                  "@instructionEndDate": {
                    "type": "string",
                    "format": "date"
                  },
                  "@revisionNumber": {
                    "type": "integer",
                    "minimum": 0
                  },
                  "@revisionDateTime": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "@revisionReferenceId": {
                    "type": "string"
                  },
                  "@revisionReason": {
                    "type": "string"
                  },
                  "@acceptRejectFlag": {
                    "type": "boolean"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "@jobInstructionId",
                  "@instructionType",
                  "@instructionStartDate"
                ],
                "description": "Instruction reference identifiers, codes and comments as well as start and end dates"
              },
              "JobDescription": {
                "title": "JobDescription",
                "type": "string",
                "description": "Text description of the job to be performed"
              },
              "JobBilling": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "BillingReference": {
                      "title": "BillingReference",
                      "type": "string",
                      "description": "The billing reference identifier."
                    },
                    "PONumber": {
                      "title": "PONumber",
                      "type": "string",
                      "description": "A purchase order number related to the job request."
                    },
                    "LineNumber": {
                      "title": "LineNumber",
                      "type": "integer",
                      "description": "A line reference value on the  purchase order or contract order that relates to the work for this specific job."
                    },
                    "Quantity": {
                      "title": "Quantity",
                      "type": "integer",
                      "description": "The quantity of the item to be billed (units, hours, etc.)"
                    },
                    "Description": {
                      "title": "Description",
                      "type": "string",
                      "description": "A textual description of the job completed, its purpose and status."
                    },
                    "Cost": {
                      "title": "Cost",
                      "type": "number",
                      "description": "The value to be billed for the specific job."
                    },
                    "PrivateInformation": {
                      "title": "PrivateInformation",
                      "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
                    }
                  },
                  "additionalProperties": false,
                  "required": [
                    "BillingReference",
                    "Quantity",
                    "PrivateInformation"
                  ]
                },
                "description": "Optional details concerning the way the job be billed or invoiced for the work performed."
              },
              "JobRelease": {
                "title": "JobRelease",
                "type": "string",
                "format": "date-time",
                "description": "Date-Time when the job is expected to be completed and released, assuming it is held until this point in time.  Typically not used by the JobPerformer."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              },
              "@jobId": {
                "type": "string"
              },
              "@subJobId": {
                "type": "string"
              },
              "@jobDependency": {
                "type": "string"
              },
              "@orderId": {
                "type": "string"
              },
              "@serviceLevel": {
                "type": "string"
              },
              "@performerCount": {
                "type": "integer",
                "minimum": 1
              }
            },
            "additionalProperties": false,
            "description": "Allows the message to assign job information.  If more than one company or process is required for a job, enter multiple records and link using the jobId.  If one job is dependent on the completion of another, link the jobs using jobID and jobDependency. (v3.0)",
            "required": [
              "JobType",
              "JobRequester",
              "@jobId"
            ]
          }
        },
        "additionalProperties": false
      },
      "location": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/location.schema.json",
        "title": "location",
        "type": "object",
        "properties": {},
        "$defs": {
          "Location": {
            "type": "object",
            "properties": {
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              },
              "@fileSize": {
                "type": "integer"
              }
            },
            "additionalProperties": false,
            "description": "Identification of where the media is stored. Used by systems to notify locations of essence instance",
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "Satellite": {
                    "title": "Satellite",
                    "type": "object",
                    "properties": {
                      "SatelliteName": {
                        "title": "SatelliteName",
                        "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                      },
                      "SatellitePosition": {
                        "title": "SatellitePosition",
                        "type": "number",
                        "minimum": -180.0,
                        "maximum": 180.0,
                        "description": "Location of Satellite in degrees east or west relative to the prime meridian (0) -  negative values are west  (-123.0) and positive values are east (+123.0). (v3.0)"
                      },
                      "Transponders": {
                        "type": "array",
                        "items": {
                          "type": "object",
                          "properties": {
                            "@primaryAlternate": {
                              "type": "string",
                              "enum": [
                                "Primary",
                                "Alternate1",
                                "Alternate2"
                              ]
                            }
                          },
                          "additionalProperties": false,
                          "oneOf": [
                            {
                              "type": "object",
                              "properties": {
                                "TransponderName": {
                                  "title": "TransponderName",
                                  "type": "string",
                                  "description": "The designated name for a specific transponder as defined in the Receiver used as a shortcut to select a transponder. (v3.0)"
                                }
                              },
                              "additionalProperties": false,
                              "required": [
                                "TransponderName"
                              ]
                            },
                            {
                              "type": "object",
                              "properties": {
                                "TransponderDetail": {
                                  "title": "TransponderDetail",
                                  "type": "object",
                                  "properties": {
                                    "TransponderNumber": {
                                      "title": "TransponderNumber",
                                      "type": "integer",
                                      "minimum": 1,
                                      "description": "Transponder number\n1 or greater"
                                    },
                                    "TransponderFrequency": {
                                      "title": "TransponderFrequency",
                                      "type": "number",
                                      "minimum": 0,
                                      "pattern": "[0-9]{1,5}[.][0-9]",
                                      "description": "Frequency (MHz) assigned to the transponder number (12700.0 = 12.7000 GHz for DBS). (v3.0)"
                                    },
                                    "Polarity": {
                                      "title": "Polarity",
                                      "type": "string",
                                      "enum": [
                                        "Vertical",
                                        "Horizontal",
                                        "Right",
                                        "Left"
                                      ],
                                      "description": "Left or Right for circularly polarized DBS satellites, Horizontal or Vertical for linearly polarized satellites"
                                    },
                                    "TransponderName": {
                                      "title": "TransponderName",
                                      "type": "string",
                                      "description": "The designated name for a specific transponder as defined in the Receiver. (v3.0)"
                                    },
                                    "SymbolRate": {
                                      "title": "SymbolRate",
                                      "type": "integer",
                                      "description": "Rate of transmission in Kilo Symbols/second. (v3.0)"
                                    },
                                    "ForwardErrorCorrection": {
                                      "title": "ForwardErrorCorrection",
                                      "type": "string",
                                      "enum": [
                                        "34",
                                        "56",
                                        "78"
                                      ],
                                      "description": "Error correction used by the transponder 3/4, 5/6 or 7/8. (v3.0)"
                                    },
                                    "EncryptionSystem": {
                                      "title": "EncryptionSystem",
                                      "type": "string",
                                      "description": "None or a specific encryption system. (v3.0)"
                                    },
                                    "PrivateInformation": {
                                      "title": "PrivateInformation",
                                      "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
                                    }
                                  },
                                  "additionalProperties": false,
                                  "required": [
                                    "TransponderNumber",
                                    "TransponderFrequency",
                                    "Polarity"
                                  ],
                                  "description": "Detailed definition for each transponder including ability to name the transponder"
                                }
                              },
                              "additionalProperties": false,
                              "required": [
                                "TransponderDetail"
                              ]
                            }
                          ]
                        },
                        "minItems": 1
                      },
                      "Receiver": {
                        "title": "Receiver",
                        "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                        "description": "A physical device that is used to tune a signal from the satellite and provides an output for media."
                      },
                      "Encoder": {
                        "title": "Encoder",
                        "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                        "description": "The destination recording device for the media."
                      },
                      "@numberOfTransponders": {
                        "type": "integer",
                        "minimum": 1
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "SatelliteName",
                      "Transponders",
                      "Receiver",
                      "Encoder"
                    ]
                  }
                },
                "additionalProperties": false,
                "required": [
                  "Satellite"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "AssetServer": {
                    "title": "AssetServer",
                    "type": "object",
                    "properties": {
                      "PathName": {
                        "title": "PathName",
                        "$ref": "#/components/schemas/bxftypes/$defs/BxfUri",
                        "description": "Shall include a fully qualified filename"
                      },
                      "ReferenceName": {
                        "title": "ReferenceName",
                        "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                      },
                      "UserName": {
                        "title": "UserName",
                        "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                      },
                      "Password": {
                        "title": "Password",
                        "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                      },
                      "Description": {
                        "title": "Description",
                        "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                      },
                      "@playoutAllowed": {
                        "type": "boolean"
                      },
                      "@fileTransferAllowed": {
                        "type": "boolean"
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "PathName",
                      "@playoutAllowed",
                      "@fileTransferAllowed"
                    ]
                  }
                },
                "additionalProperties": false,
                "required": [
                  "AssetServer"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "RouterSource": {
                    "title": "RouterSource",
                    "type": "object",
                    "properties": {
                      "Name": {
                        "title": "Name",
                        "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                        "description": "(See Configuration Section in BXF Protocol Documentation)"
                      },
                      "CrossPoint": {
                        "title": "CrossPoint",
                        "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "Name"
                    ]
                  }
                },
                "additionalProperties": false,
                "required": [
                  "RouterSource"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "PhysicalAsset": {
                    "title": "PhysicalAsset",
                    "type": "object",
                    "properties": {
                      "MediaReferenceName": {
                        "title": "MediaReferenceName",
                        "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                      },
                      "PhysicalLocation": {
                        "title": "PhysicalLocation",
                        "type": "object",
                        "properties": {
                          "Dimension": {
                            "type": "array",
                            "items": {
                              "type": "object",
                              "properties": {
                                "@name": {
                                  "type": "string",
                                  "minLength": 1,
                                  "maxLength": 255
                                },
                                "@value": {
                                  "type": "string",
                                  "minLength": 1,
                                  "maxLength": 255
                                }
                              },
                              "additionalProperties": false
                            },
                            "minItems": 1
                          }
                        },
                        "additionalProperties": false,
                        "required": [
                          "Dimension"
                        ]
                      },
                      "@assetName": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 255
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "MediaReferenceName",
                      "@assetName"
                    ],
                    "description": "A means of storing essence that can be easily transported"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "PhysicalAsset"
                ]
              }
            ]
          }
        },
        "additionalProperties": false
      },
      "macro": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/macro.schema.json",
        "title": "macro",
        "type": "object",
        "properties": {},
        "$defs": {
          "Macro": {
            "type": "object",
            "properties": {
              "MacroName": {
                "title": "MacroName",
                "type": "string",
                "description": "(See Configuration Section in BXF Protocol Documentation)"
              },
              "MacroParameterString": {
                "type": "array",
                "items": {
                  "type": "string"
                },
                "description": "A string containing the macro"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "required": [
              "MacroName"
            ]
          }
        },
        "additionalProperties": false
      },
      "nonprimaryevent": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/nonprimaryevent.schema.json",
        "title": "nonprimaryevent",
        "type": "object",
        "properties": {},
        "$defs": {
          "NonPrimaryEvent": {
            "type": "object",
            "properties": {
              "NonPrimaryEventName": {
                "title": "NonPrimaryEventName",
                "type": "string",
                "description": "Used to define the type of event (eg. Key, GPI, Tone, Audio or Video Effects) (See Configuration Section in BXF Protocol Documentation)"
              },
              "OptionalFlag": {
                "title": "OptionalFlag",
                "type": "boolean",
                "description": "Optional event, will not air unless triggered"
              },
              "PrimaryEventId": {
                "title": "PrimaryEventId",
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid",
                "description": "Linkage to the primary event id.  Not required for auxillary events.  Required to be a UUID."
              },
              "NonPrimaryElementId": {
                "title": "NonPrimaryElementId",
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid",
                "description": "A UUID that is used to link to the format structure's non-primary element definition"
              },
              "Offset": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "OffsetTime": {
                      "title": "OffsetTime",
                      "$ref": "#/components/schemas/bxftypes/$defs/BxfSmpteTime",
                      "description": "The amount of time to offset the nonprimary event from the start or end of a primary event based on the values of the attribute settings."
                    },
                    "@offsetFrom": {
                      "type": "string",
                      "enum": [
                        "BeginningofEvent",
                        "EndofEvent"
                      ]
                    },
                    "@offsetType": {
                      "type": "string",
                      "enum": [
                        "Start",
                        "End"
                      ]
                    },
                    "@direction": {
                      "type": "string",
                      "enum": [
                        "Positive",
                        "Negative"
                      ]
                    }
                  },
                  "additionalProperties": false
                },
                "maxItems": 2,
                "description": "The definition of how a non-primary event should run relative to the primary event either using the start or end points of either event."
              },
              "Macros": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/macro/$defs/Macro"
                }
              },
              "AudioOverPercent": {
                "title": "AudioOverPercent",
                "type": "integer",
                "minimum": 0,
                "maximum": 100,
                "description": "Used to set an adjustment to the audio levels for voice over audio"
              },
              "GraphicData": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/nonprimaryevent/$defs/GraphicData"
                },
                "description": "Use to add in graphics associated data  to a specific secondary event. Used for delineating a graphic collection, keyer number, template name, etc."
              },
              "OverlayPlacement": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/element/$defs/OverlayOpportunityType"
                },
                "description": "Describes locations in time and space where overlays are either permitted or restricted from use."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              },
              "@auxillary": {
                "type": "boolean"
              }
            },
            "additionalProperties": false,
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "NonProgramEvents": {
                    "title": "NonProgramEvents",
                    "$ref": "#/components/schemas/nonprogramevent/$defs/NonProgramEvent",
                    "description": "Used to specify non-primary events that use speciific interstitial content"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "NonProgramEvents"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "ProgramEvent": {
                    "title": "ProgramEvent",
                    "$ref": "#/components/schemas/programevent/$defs/ProgramEvent",
                    "description": "Used to specify non-primary events that use specific program content"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "ProgramEvent"
                ]
              }
            ],
            "required": [
              "NonPrimaryEventName"
            ]
          },
          "GraphicData": {
            "type": "object",
            "properties": {
              "GraphicCollectionName": {
                "title": "GraphicCollectionName",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "The collection in which the template can be found"
              },
              "GraphicTemplate": {
                "title": "GraphicTemplate",
                "type": "string",
                "description": "Name of template used for graphics overlay"
              },
              "GraphicKeyer": {
                "title": "GraphicKeyer",
                "type": "string",
                "description": "Name or number of the keyer being used"
              },
              "GraphicKeyValuePairs": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "Key": {
                      "title": "Key",
                      "type": "string"
                    },
                    "Value": {
                      "title": "Value",
                      "type": "string"
                    },
                    "@itemSequence": {
                      "type": "integer",
                      "minimum": 1
                    }
                  },
                  "additionalProperties": false,
                  "required": [
                    "Key",
                    "Value"
                  ]
                },
                "description": "Pair of Key values associated with Graphic details (v6.0)"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "description": "Use to add in graphics associated data  to a specific secondary event. Used for delineating a graphic collection, keyer number, template name, etc."
          }
        },
        "additionalProperties": false
      },
      "nonprogramcontent": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/nonprogramcontent.schema.json",
        "title": "nonprogramcontent",
        "type": "object",
        "properties": {},
        "$defs": {
          "NonProgramContent": {
            "type": "object",
            "properties": {
              "Details": {
                "title": "Details",
                "$ref": "#/components/schemas/nonprogramdetail/$defs/NonProgramDetail",
                "description": "Details of the non-program content"
              },
              "ContentMetaData": {
                "title": "ContentMetaData",
                "$ref": "#/components/schemas/contentmetadata/$defs/ContentMetaData",
                "description": "Content identifier and other information"
              },
              "SalesContract": {
                "title": "SalesContract",
                "$ref": "#/components/schemas/contract/$defs/SalesContract",
                "description": "Contract information for the interstitial content (commercials)"
              },
              "ParentalRating": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/bxfparentalrating/$defs/BxfParentalRating"
                },
                "description": "Parental rating for the show for one region (PMCP)"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "required": [
              "Details",
              "ContentMetaData"
            ]
          }
        },
        "additionalProperties": false
      },
      "nonprogramdetail": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/nonprogramdetail.schema.json",
        "title": "nonprogramdetail",
        "type": "object",
        "properties": {},
        "$defs": {
          "Advertiser": {
            "type": "object",
            "properties": {
              "AdvertiserName": {
                "title": "AdvertiserName",
                "type": "object",
                "properties": {
                  "@AdvertiserCode": {
                    "type": "string"
                  }
                },
                "additionalProperties": false,
                "allOf": [
                  {
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                  }
                ],
                "required": []
              },
              "ParentCompany": {
                "title": "ParentCompany",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfCompany"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "required": [
              "AdvertiserName"
            ]
          },
          "Agency": {
            "type": "object",
            "properties": {
              "AgencyName": {
                "title": "AgencyName",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Name of advertising agency (buying agency)"
              },
              "EstimateNumber": {
                "title": "EstimateNumber",
                "type": "string",
                "description": "Refers to the contract identifier in the agency system"
              },
              "AgencyCode": {
                "title": "AgencyCode",
                "type": "string",
                "description": "Recommended to use TVB EDI Value or see Configuration Section in BXF Protocol Documentation"
              },
              "AlternateAgencyName": {
                "title": "AlternateAgencyName",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Optional entry for an alternate name for the Agency of Record. (v3.0)"
              },
              "EstimateName": {
                "title": "EstimateName",
                "type": "string",
                "description": "Paired with the EstimateNumber to identify the contract in the agency system. (v3.0)"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "required": [
              "AgencyName"
            ]
          },
          "NonProgramDetail": {
            "type": "object",
            "properties": {
              "AdType": {
                "title": "AdType",
                "type": "string",
                "enum": [
                  "Commercial",
                  "Direct Response",
                  "Double Barter",
                  "Fee Spot",
                  "General",
                  "Paid Program",
                  "Promo",
                  "PSA",
                  "Optional Barter",
                  "Trade/Barter",
                  "Other"
                ],
                "description": "Used to describe the type of advertisement being placed (e.g. Commercial, General, Promo, PSA, etc.).  Note: added \u201cCommercial\u201d as an additional enumeration to be explicit from the General option. (v6.0) Added Fee Spot, Double Barter and Optional Barter (v8.0)"
              },
              "SpotType": {
                "title": "SpotType",
                "type": "string",
                "enum": [
                  "BillBoard",
                  "Bookend",
                  "Paid Program",
                  "Piggyback",
                  "Standard",
                  "Other"
                ],
                "description": "Used to describe the type of spot or other interstitial (e.g. Standard, BillBoard, Bookend, etc.)  Default is Standard. (v5.0)"
              },
              "Advertiser": {
                "title": "Advertiser",
                "type": "object",
                "allOf": [
                  {
                    "$ref": "#/components/schemas/nonprogramdetail/$defs/Advertiser"
                  }
                ],
                "description": "List of advertisers associated to the spot. (v3.0)"
              },
              "Agency": {
                "title": "Agency",
                "$ref": "#/components/schemas/nonprogramdetail/$defs/Agency",
                "description": "Agency of record for the spot. (v3.0)"
              },
              "Product": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/nonprogramdetail/$defs/Product"
                },
                "description": "List of all products and/or brand names and the advertiser campaign associated to the spot to be aired. (v3.0)"
              },
              "MakeGoodFlag": {
                "title": "MakeGoodFlag",
                "type": "boolean",
                "description": "Used to indicate the spot is being used as a make good for a previous ordered spot that did not air properly.  Default is 0."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "required": [
              "AdType",
              "SpotType"
            ]
          },
          "Product": {
            "type": "object",
            "properties": {
              "Name": {
                "title": "Name",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Product name for commercial spot content"
              },
              "ProductCode": {
                "title": "ProductCode",
                "type": "string",
                "properties": {
                  "@industryGroup": {
                    "type": "string"
                  },
                  "@majorCategory": {
                    "type": "string"
                  },
                  "@subCategory": {
                    "type": "string"
                  },
                  "@productCategory": {
                    "type": "string"
                  }
                },
                "additionalProperties": false,
                "required": [],
                "description": "Recommend use of TVB EDI Value that indicates the category of product (e.g. \"Alcoholic Beverages\") or see Configuration Section in BXF Protocol Documentation"
              },
              "BrandName": {
                "title": "BrandName",
                "type": "object",
                "properties": {
                  "@brandCode": {
                    "type": "string"
                  }
                },
                "additionalProperties": false,
                "allOf": [
                  {
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                  }
                ],
                "required": [],
                "description": "Brand name associated to the advertiser campaign. (v3.0)"
              },
              "AdvertiserCampaign": {
                "title": "AdvertiserCampaign",
                "type": "object",
                "properties": {
                  "@advertiserCampaignCode": {
                    "type": "string"
                  }
                },
                "additionalProperties": false,
                "allOf": [
                  {
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                  }
                ],
                "required": [],
                "description": "Campaign name associated to the spot purchase. (v3.0)"
              },
              "DirectResponse": {
                "title": "DirectResponse",
                "type": "object",
                "properties": {
                  "DRPhoneNumber": {
                    "title": "DRPhoneNumber",
                    "type": "string"
                  },
                  "DRCode": {
                    "title": "DRCode",
                    "type": "string"
                  },
                  "DR_URL": {
                    "title": "DR_URL",
                    "type": "string",
                    "format": "uri"
                  },
                  "PrivateInformation": {
                    "title": "PrivateInformation",
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
                  }
                },
                "additionalProperties": false,
                "description": "Direct Response information (v6.0)"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "required": [
              "Name"
            ]
          }
        },
        "additionalProperties": false
      },
      "nonprogramevent": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/nonprogramevent.schema.json",
        "title": "nonprogramevent",
        "type": "object",
        "properties": {},
        "$defs": {
          "Constraint": {
            "type": "object",
            "properties": {
              "Rules": {
                "title": "Rules",
                "type": "object",
                "properties": {
                  "RuleName": {
                    "title": "RuleName",
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                    "description": "A name to reference the rule"
                  },
                  "StartTimeLimit": {
                    "title": "StartTimeLimit",
                    "type": "string",
                    "format": "time",
                    "description": "The earliest permitted start time for this event under the terms of the contract"
                  },
                  "EndTimeLimit": {
                    "title": "EndTimeLimit",
                    "type": "string",
                    "format": "time",
                    "description": "The latest permitted start time for this event under the terms of the contract"
                  },
                  "StartDateLimit": {
                    "title": "StartDateLimit",
                    "type": "string",
                    "format": "date",
                    "description": "First date that this event can be aired on."
                  },
                  "EndDateLimit": {
                    "title": "EndDateLimit",
                    "type": "string",
                    "format": "date",
                    "description": "Last date that this event can be aired on."
                  },
                  "DaysOfWeekAllowed": {
                    "title": "DaysOfWeekAllowed",
                    "$ref": "#/components/schemas/bxftypes/$defs/DayPattern",
                    "description": "Assumes start of week is Monday.  Indicates the days of the week that the content can be aired."
                  },
                  "Classification": {
                    "type": "array",
                    "items": {
                      "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                    },
                    "description": "(See Configuration Section in BXF Protocol Documentation)"
                  },
                  "SCTE-35DistributionRestrictions": {
                    "title": "SCTE-35DistributionRestrictions",
                    "$ref": "#/components/schemas/eventdata/$defs/SCTE-35DistributionRestrictions",
                    "description": "Accommodates the 2012 revision to SCTE-35 that adds distribution bits. (v3.0)"
                  },
                  "PrivateInformation": {
                    "title": "PrivateInformation",
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
                  },
                  "@ruleId": {
                    "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
                  },
                  "@negation": {
                    "type": "boolean"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "RuleName",
                  "@ruleId"
                ]
              }
            },
            "additionalProperties": false
          },
          "NonProgramEvent": {
            "type": "object",
            "properties": {
              "Details": {
                "title": "Details",
                "$ref": "#/components/schemas/nonprogramdetail/$defs/NonProgramDetail"
              },
              "SalesContract": {
                "title": "SalesContract",
                "$ref": "#/components/schemas/contract/$defs/SalesContract",
                "description": "Originating sales contract for the spot."
              },
              "Constraints": {
                "title": "Constraints",
                "$ref": "#/components/schemas/nonprogramevent/$defs/Constraint",
                "description": "Rules that restrict the movement of the spot to another time."
              },
              "TrafficCautionFlag": {
                "title": "TrafficCautionFlag",
                "type": "boolean",
                "description": "Warning indicating that the operator should think twice before preempting or changing the spot."
              },
              "SpotSalesClassification": {
                "title": "SpotSalesClassification",
                "type": "string",
                "description": "Rate section or priority code for the spot (See Configuration Section in BXF Protocol Documentation)"
              },
              "PreemptionWarning": {
                "title": "PreemptionWarning",
                "type": "boolean",
                "description": "Do not preempt the spot"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "required": [
              "Details"
            ]
          }
        },
        "additionalProperties": false
      },
      "primaryevent": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/primaryevent.schema.json",
        "title": "primaryevent",
        "type": "object",
        "properties": {},
        "$defs": {
          "PrimaryEvent": {
            "type": "object",
            "properties": {
              "PrimaryElementId": {
                "title": "PrimaryElementId",
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid",
                "description": "Uses a UUID to link to the format structure element"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "ProgramEvent": {
                    "title": "ProgramEvent",
                    "$ref": "#/components/schemas/programevent/$defs/ProgramEvent"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "ProgramEvent"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "NonProgramEvent": {
                    "title": "NonProgramEvent",
                    "$ref": "#/components/schemas/nonprogramevent/$defs/NonProgramEvent"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "NonProgramEvent"
                ]
              }
            ]
          }
        },
        "additionalProperties": false
      },
      "programcontent": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/programcontent.schema.json",
        "title": "programcontent",
        "type": "object",
        "properties": {},
        "$defs": {
          "ProgramContent": {
            "type": "object",
            "properties": {
              "ContentMetaData": {
                "title": "ContentMetaData",
                "$ref": "#/components/schemas/contentmetadata/$defs/ContentMetaData",
                "description": "Content identification and other details"
              },
              "Elements": {
                "title": "Elements",
                "type": "object",
                "properties": {
                  "Element": {
                    "type": "array",
                    "items": {
                      "$ref": "#/components/schemas/element/$defs/Element"
                    },
                    "minItems": 1
                  }
                },
                "additionalProperties": false,
                "required": [
                  "Element"
                ],
                "description": "If the program is being delivered in segmented form this describes each segment's content, position and offset from the start of the program as well as other embedded content such as inserted barter content"
              },
              "Series": {
                "title": "Series",
                "type": "string",
                "description": "If the content is part of a series this allows the entry of the episodic information"
              },
              "ProgramContract": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/contract/$defs/ProgramContract"
                },
                "description": "If the program is purchased, it may be linked to a rights contract"
              },
              "ParentalRating": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/bxfparentalrating/$defs/BxfParentalRating"
                },
                "description": "Parental rating for the show for one region (PMCP)"
              },
              "ContentType": {
                "title": "ContentType",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Used to describe the type of content (e.g. network, local, entertainment, news) (See Configuration Section in BXF Protocol Documentation) (v3.0)"
              },
              "EiCode": {
                "title": "EiCode",
                "$ref": "#/components/schemas/bxftypes/$defs/EiCode",
                "description": "Used for FCC Education/Information Children's code. (v3.0)"
              },
              "PaidProgramming": {
                "title": "PaidProgramming",
                "$ref": "#/components/schemas/contract/$defs/SalesContract"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "required": [
              "ContentMetaData"
            ]
          }
        },
        "additionalProperties": false
      },
      "programevent": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/programevent.schema.json",
        "title": "programevent",
        "type": "object",
        "properties": {},
        "$defs": {
          "ProgramEvent": {
            "type": "object",
            "properties": {
              "SegmentNumber": {
                "title": "SegmentNumber",
                "type": "integer",
                "description": "The ordering of the segments within the show"
              },
              "ProgramName": {
                "title": "ProgramName",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "The name of the show"
              },
              "Constraints": {
                "title": "Constraints",
                "$ref": "#/components/schemas/nonprogramevent/$defs/Constraint",
                "description": "Rules that constrain the scheduling of a program in order to validate a show move."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "ProgramContract": {
                    "title": "ProgramContract",
                    "$ref": "#/components/schemas/contract/$defs/ProgramContract",
                    "description": "Reference to the originating program rights contract and the date window that the content can be aired in."
                  }
                },
                "additionalProperties": false,
                "required": [
                  "ProgramContract"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "PaidProgramContract": {
                    "title": "PaidProgramContract",
                    "$ref": "#/components/schemas/contract/$defs/SalesContract",
                    "description": "Reference to sales contract for paid programming content (v3.0)"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "PaidProgramContract"
                ]
              }
            ],
            "required": [
              "SegmentNumber"
            ]
          }
        },
        "additionalProperties": false
      },
      "qualitycontrol": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/qualitycontrol.schema.json",
        "title": "qualitycontrol",
        "type": "object",
        "properties": {},
        "$defs": {
          "FragmentLocation": {
            "type": "object",
            "properties": {
              "StartTime": {
                "title": "StartTime",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfSmpteTime",
                "description": "Start time on the video"
              },
              "EndTime": {
                "title": "EndTime",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfSmpteTime",
                "description": "End time on the video"
              },
              "SpatialLocation": {
                "title": "SpatialLocation",
                "type": "string",
                "description": "A string representing a rectangular spatial region of the video track according to the String pattern defined in W3C Media Fragments - 4.2.2 Spatial Dimension [3]"
              }
            },
            "additionalProperties": false,
            "description": "The time range and a spatial location that defines a unique part of the video essence. (v5.0)"
          },
          "QualityControl": {
            "type": "object",
            "properties": {
              "ContentId": {
                "title": "ContentId",
                "$ref": "#/components/schemas/bxfcontentid/$defs/BxfContentId",
                "description": "Used to identify a specific media to apply the QC process to."
              },
              "@dueDateTime": {
                "type": "string",
                "format": "date-time"
              }
            },
            "additionalProperties": false,
            "description": "Media often must be checked for its quality each time it is copied or moved to another location.  Multiple checks are typical to confirm that the audio, video and other attributes meet the standards of the intended usage. (v5.0)",
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "QCProfile": {
                    "title": "QCProfile",
                    "$ref": "#/components/schemas/qualitycontrol/$defs/QCProfile",
                    "description": "Used to define a set of test instructions that are generally related and which can be called using just the identifier."
                  }
                },
                "additionalProperties": false,
                "required": [
                  "QCProfile"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "QCProfileList": {
                    "title": "QCProfileList",
                    "type": "object",
                    "properties": {
                      "QCProfileID": {
                        "type": "array",
                        "items": {
                          "type": "string",
                          "properties": {
                            "@ResultsRule": {
                              "type": "string",
                              "enum": [
                                "AND",
                                "OR",
                                "MinimumRelevance"
                              ]
                            },
                            "@RelevanceLevel": {
                              "type": "integer",
                              "minimum": 0,
                              "maximum": 10
                            }
                          },
                          "additionalProperties": false,
                          "required": []
                        },
                        "minItems": 1,
                        "description": "Unique identifier (usually UUID) to identify the saved profile, but may be a simple text string that is unique within the environment used."
                      },
                      "QCProfileScope": {
                        "title": "QCProfileScope",
                        "$ref": "#/components/schemas/qualitycontrol/$defs/QCScope",
                        "description": "Range of time on the media (using media timecode) that should be tested for all QCProfileCheckItems.  If not defined the entire media will be checked."
                      },
                      "QCReportID": {
                        "title": "QCReportID",
                        "type": "string",
                        "description": "Normally a UUID to be assured of a globally unique identifier."
                      },
                      "PrivateInformation": {
                        "title": "PrivateInformation",
                        "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "QCProfileID"
                    ],
                    "description": "List of previously defined QCProfiles to run against selected media."
                  }
                },
                "additionalProperties": false,
                "required": [
                  "QCProfileList"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "QCItem": {
                    "type": "array",
                    "items": {
                      "$ref": "#/components/schemas/qualitycontrol/$defs/QCItem"
                    },
                    "minItems": 1,
                    "description": "Each check of the media can be part or all of the media and each of its components.  The checks may be done through machine control automatically or manually by a technician using a set of defined rules to pass.  A CheckItem option can be part of a profile or stand alone."
                  }
                },
                "additionalProperties": false,
                "required": [
                  "QCItem"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "QCReport": {
                    "type": "array",
                    "items": {
                      "$ref": "#/components/schemas/qualitycontrol/$defs/QCReports"
                    },
                    "minItems": 1,
                    "description": "Used to report back the results of the QC testing for either a single profile, multiple profiles or a single QCCheckItem. (Modified to be unbounded in v6.0)"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "QCReport"
                ]
              }
            ]
          },
          "QCDetailedAnnotation": {
            "type": "object",
            "properties": {
              "DetailedDescription": {
                "title": "DetailedDescription",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Detailed description of QC Test performed."
              },
              "QCTestPerformer": {
                "title": "QCTestPerformer",
                "$ref": "#/components/schemas/qualitycontrol/$defs/QCTestPerformer",
                "description": "What person, system or tool was used to perform the QC Test."
              },
              "QCAnnotationDateTime": {
                "title": "QCAnnotationDateTime",
                "type": "string",
                "format": "date-time",
                "description": "When the Annotation was created."
              }
            },
            "additionalProperties": false,
            "description": "Additional descriptive details concerning who or what system was deployed to perform the QC test and when it was performed.",
            "required": [
              "DetailedDescription"
            ]
          },
          "QCItem": {
            "type": "object",
            "properties": {
              "QCItemID": {
                "title": "QCItemID",
                "type": "string",
                "description": "Unique identifier for the item to be tested.  Note - EBU has defined specific values for each QC Test ID (eg-0010B is a test for Loudness on baseband)"
              },
              "QCItemName": {
                "title": "QCItemName",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Brief name of the QC Test to be performed. (eg Aspect Ratio)"
              },
              "Layer": {
                "title": "Layer",
                "type": "string",
                "enum": [
                  "baseband",
                  "bitstream",
                  "x-check",
                  "wrapper"
                ],
                "description": "Equvialent to the EBU-QC Test Layer Field"
              },
              "Category": {
                "title": "Category",
                "type": "string",
                "enum": [
                  "absolute",
                  "objective",
                  "regulatory",
                  "subjective"
                ],
                "description": "Equivalent to the EBU-QC Test Category Field"
              },
              "Relevance": {
                "title": "Relevance",
                "type": "integer",
                "minimum": 0,
                "maximum": 10,
                "description": "Used in conjunction with the QCProfile's relevanceLevel and checkResultRule values to determine how important this check is relative to the other checks in the profile and to determine the overall report checkresult."
              },
              "EssenceType": {
                "title": "EssenceType",
                "type": "string",
                "enum": [
                  "Video",
                  "Audio",
                  "Subtitle",
                  "Captioning",
                  "Metadata",
                  "Other"
                ],
                "description": "Indicates the content type that the QCItem focuses on."
              },
              "QCItemScope": {
                "title": "QCItemScope",
                "$ref": "#/components/schemas/qualitycontrol/$defs/QCScope",
                "description": "Limits the execution of the QCItem to one or more specific time ranges and overrides the QCProfileScope, if any."
              },
              "QCItemInput": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/qualitycontrol/$defs/QCItemInput"
                },
                "description": "Whether machine controlled or manually performed, a set of rules that govern what is being tested and how are described by the parameters."
              },
              "QCReportID": {
                "title": "QCReportID",
                "type": "string",
                "description": "Used to identify the QCReport that will supply the results of the QCTest requested.  Normally a UUID to be assured of a globally unique identifier."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              },
              "@parameterType": {
                "type": "string",
                "enum": [
                  "check",
                  "measure",
                  "readout",
                  "x-check"
                ]
              }
            },
            "additionalProperties": false,
            "description": "Each check of the media can be part or all of the media and each of its components.  The checks may be done through machine control automatically or manually by a technician using a set of defined rules to pass.  A CheckItem option can be part of a profile or stand alone.",
            "required": [
              "QCItemID",
              "QCItemName"
            ]
          },
          "QCItemInput": {
            "type": "object",
            "properties": {
              "KeyWord": {
                "title": "KeyWord",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Unique name of the test input within the scope of QCItem and as accepted within the scope of the organization.  (Note EBU supports a specific defined list of names - eg. VideoAspectRatio)."
              },
              "Description": {
                "title": "Description",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Brief description related to the type of test to be performed."
              },
              "FragmentLocation": {
                "title": "FragmentLocation",
                "$ref": "#/components/schemas/qualitycontrol/$defs/FragmentLocation",
                "description": "The time range and spatial location on the video (region of the screen) to be tested."
              },
              "Track": {
                "title": "Track",
                "type": "string",
                "description": "The unique identification of the media track the input refers to (eg- a number such as Track 1 or a specific UUID)"
              },
              "WrapperLocation": {
                "title": "WrapperLocation",
                "type": "object",
                "oneOf": [
                  {
                    "type": "object",
                    "properties": {
                      "MXFWrapperLocation": {
