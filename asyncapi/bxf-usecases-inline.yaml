            "additionalProperties": false,
            "description": "Who or what system performed the QC test",
            "required": [
              "QCPerformerName"
            ]
          }
        },
        "additionalProperties": false
      },
      "schedule": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/schedule.schema.json",
        "title": "schedule",
        "type": "object",
        "properties": {},
        "$defs": {
          "Schedule": {
            "type": "object",
            "properties": {
              "Channel": {
                "title": "Channel",
                "$ref": "#/components/schemas/bxfchannel/$defs/Channel",
                "description": "ATSC Channel Defninition used in PMCP"
              },
              "ScheduleName": {
                "title": "ScheduleName",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "A name to describe the schedule"
              },
              "RealTimeDetail": {
                "title": "RealTimeDetail",
                "type": "object",
                "properties": {
                  "EventId": {
                    "title": "EventId",
                    "$ref": "#/components/schemas/eventdata/$defs/EventExtId",
                    "description": "Links to the events as described in ScheduledEvent if in the future or in the AsRun if current or in the past. Can be null if the event was added manually."
                  },
                  "RealTimeSequence": {
                    "title": "RealTimeSequence",
                    "type": "integer",
                    "description": "If zero, indicates the current airing event; if negative, indicates that the event was in the past and has aired; if positive, indicates an event that will air.  The integer number indicates the sequence order going forward or backward in time."
                  },
                  "EventStartTime": {
                    "title": "EventStartTime",
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfDateTime",
                    "description": "Either the actual start time if the event already aired or is airing or the expected start time if in the future."
                  },
                  "PrivateInformation": {
                    "title": "PrivateInformation",
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "EventId",
                  "RealTimeSequence"
                ]
              },
              "PlayoutRestrictions": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/schedule/$defs/PlayoutRestrictions"
                },
                "description": "Used to define what is allowed or restricted to the viewing of content in different venues (locations, devices, etc.) and the provisioning of alternative content when this happens.  Each Venue may have only one replacement option or null. (v4.0)"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              },
              "@type": {
                "$ref": "#/components/schemas/bxftypes/$defs/ScheduleType"
              },
              "@scheduleId": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@dayPattern": {
                "$ref": "#/components/schemas/bxftypes/$defs/DayPattern"
              },
              "@scheduleStart": {
                "type": "string",
                "format": "date-time"
              },
              "@scheduleEnd": {
                "type": "string",
                "format": "date-time"
              },
              "@invokeSchedule": {
                "type": "boolean"
              }
            },
            "additionalProperties": false,
            "description": "A schedule",
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "ScheduledEvent": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    },
                    "minItems": 1
                  }
                },
                "additionalProperties": false,
                "required": [
                  "ScheduledEvent"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "AsRun": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "oneOf": [
                        {
                          "type": "object",
                          "properties": {
                            "CompleteAsRun": {
                              "title": "CompleteAsRun",
                              "$ref": "#/components/schemas/asrun/$defs/CompleteAsRun"
                            }
                          },
                          "additionalProperties": false,
                          "required": [
                            "CompleteAsRun"
                          ]
                        },
                        {
                          "type": "object",
                          "properties": {
                            "BasicAsRun": {
                              "title": "BasicAsRun",
                              "$ref": "#/components/schemas/asrun/$defs/BasicAsRun"
                            }
                          },
                          "additionalProperties": false,
                          "required": [
                            "BasicAsRun"
                          ]
                        }
                      ]
                    },
                    "minItems": 1
                  }
                },
                "additionalProperties": false,
                "required": [
                  "AsRun"
                ]
              }
            ],
            "required": [
              "@type",
              "@scheduleId"
            ]
          },
          "PlayoutRestrictions": {
            "type": "object",
            "properties": {
              "Period": {
                "title": "Period",
                "type": "object",
                "oneOf": [
                  {
                    "type": "object",
                    "properties": {
                      "FullLength": {
                        "title": "FullLength",
                        "type": "boolean"
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "FullLength"
                    ]
                  },
                  {
                    "type": "object",
                    "properties": {
                      "PartialDaypart": {
                        "title": "PartialDaypart",
                        "$ref": "#/components/schemas/bxftypes/$defs/BxfDaypart"
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "PartialDaypart"
                    ]
                  }
                ],
                "description": "The period during which the restriction for the venue applies.  Either the full normal length of the schedule or a defined period when it is restricted."
              },
              "ReplacementSchedule": {
                "title": "ReplacementSchedule",
                "type": "object",
                "oneOf": [
                  {
                    "type": "object",
                    "properties": {
                      "NoReplacement": {
                        "title": "NoReplacement",
                        "type": "boolean"
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "NoReplacement"
                    ]
                  }
                ],
                "description": "Content that will be provided to the viewer in place of the regularly scheduled content for the specific vewing option when it is a restriction."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              },
              "@playoutRestrictionType": {
                "type": "string",
                "enum": [
                  "Allow",
                  "Restrict"
                ]
              },
              "@reason": {
                "type": "string"
              },
              "@geography": {
                "type": "string"
              },
              "@screenType": {
                "type": "string",
                "enum": [
                  "All",
                  "TV Only",
                  "All Non-TV Devices",
                  "Desktop Computers",
                  "Tablets",
                  "Mobile Phones",
                  "Tablets and Phones",
                  "Computers and Phones",
                  "Computers and Tablets",
                  "Other"
                ]
              },
              "@operatingSystem": {
                "type": "string",
                "enum": [
                  "Android",
                  "Linux",
                  "MAC-OSX",
                  "OSI",
                  "PC-Windows",
                  "Unknown"
                ]
              },
              "@featureSet": {
                "type": "string",
                "enum": [
                  "DigitalOutput",
                  "LocationAware",
                  "LocalStorage",
                  "AnalogOutput",
                  "HDCP",
                  "FastForward",
                  "ProgrammerBrandingRequired"
                ]
              },
              "@minVersion": {
                "type": "number"
              }
            },
            "additionalProperties": false,
            "description": "Used to establish how content on a schedule can be veiwed by defining what is allowed or restricted across various parameters: geography, screen types, operating systems, feature set, or minimum software version.  If viewing is restricted, there is an option to provision alternative content.  VewingOptions is recursive.",
            "required": [
              "Period",
              "ReplacementSchedule",
              "@playoutRestrictionType"
            ]
          }
        },
        "additionalProperties": false
      },
      "scheduledevent": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2022/BXF/scheduledevent.schema.json",
        "title": "scheduledevent",
        "type": "object",
        "properties": {},
        "$defs": {
          "ScheduledEvent": {
            "type": "object",
            "properties": {
              "EventData": {
                "title": "EventData",
                "type": "string",
                "description": "Specifies the data for the complete show or a single event"
              },
              "Content": {
                "title": "Content",
                "type": "object",
                "properties": {
                  "ContentDetail": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  }
                },
                "additionalProperties": false,
                "required": [],
                "description": "This is not expected to be present for comments, program headers and break headers, but is expected in all other cases."
              },
              "AlternateAudioContent": {
                "type": "array",
                "items": {
                  "type": "string"
                },
                "description": "If audio not directly associated with the primary video content is scheduled to run with the video a separate content for just this audio must be indicated."
              },
              "ContentType": {
                "title": "ContentType",
                "type": "string",
                "description": "Used to describe the type of content (eg. network, local, entertainment, news) (See Configuration Section in BXF Protocol Documentation)"
              },
              "Format": {
                "title": "Format",
                "type": "object",
                "oneOf": [
                  {
                    "type": "object",
                    "properties": {
                      "Formats": {
                        "title": "Formats",
                        "type": "string",
                        "description": "The definition of the empty structure of a program as used by the traffic system to construct a schedule grid."
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "Formats"
                    ]
                  },
                  {
                    "type": "object",
                    "properties": {
                      "FormatId": {
                        "title": "FormatId",
                        "type": "string",
                        "description": "The unique identifier for a format"
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "FormatId"
                    ]
                  }
                ]
              },
              "ScheduleElements": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "EventData": {
                      "title": "EventData",
                      "type": "string",
                      "description": "Specifies the data for the complete show or a single event"
                    },
                    "AlternateAudioContent": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      },
                      "description": "If audio not directly associated with the primary video content is scheduled to run with the video a separate content for just this audio must be indicated."
                    },
                    "PrivateInformation": {
                      "title": "PrivateInformation",
                      "type": "string"
                    }
                  },
                  "additionalProperties": false,
                  "oneOf": [
                    {
                      "type": "object",
                      "properties": {
                        "Content": {
                          "title": "Content",
                          "type": "object",
                          "description": "This is not expected to be present for comments, program headers and break headers, but is expected in all other cases."
                        }
                      },
                      "additionalProperties": false,
                      "required": [
                        "Content"
                      ]
                    },
                    {
                      "type": "object",
                      "properties": {
                        "MultiContent": {
                          "title": "MultiContent",
                          "type": "string",
                          "description": "Intended in cases where you would have more than one program content embedded within a single program such as compilation programs, cartoons, etc. (v4.0)"
                        }
                      },
                      "additionalProperties": false,
                      "required": [
                        "MultiContent"
                      ]
                    }
                  ]
                },
                "description": "Specifies the elemental structure of the show"
              },
              "Series": {
                "title": "Series",
                "$ref": "#/components/schemas/scheduledevent/$defs/Series"
              },
              "ParentalRating": {
                "type": "array",
                "items": {
                  "type": "string"
                },
                "description": "Parental rating for the show for one region (PMCP)"
              },
              "EiCode": {
                "title": "EiCode",
                "type": "string",
                "description": "Used for FCC Education/Information Children's code"
              },
              "ContentPlayNumber": {
                "title": "ContentPlayNumber",
                "type": "integer",
                "minimum": 1,
                "description": "The play number value relative to the contract used to authorize the content or the total times the content has been used on the schedule."
              },
              "PremiereFlag": {
                "title": "PremiereFlag",
                "type": "boolean",
                "description": "Used to indicate that this is the first airing of the content on this schedule."
              },
              "LastPlayFlag": {
                "title": "LastPlayFlag",
                "type": "boolean",
                "description": "Used to indicate that this is the last airing of the content on this schedule."
              },
              "TransformationOutput": {
                "title": "TransformationOutput",
                "type": "string",
                "description": "Used to create a transformation of the video from its current stored value to a different transmission value."
              },
              "AlternateScheduleEventFlag": {
                "title": "AlternateScheduleEventFlag",
                "type": "boolean",
                "properties": {
                  "@LinkedEventId": {
                    "type": "string"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "@LinkedEventId"
                ],
                "description": "Allows linkage to standby promo content or other content that serve as backups or alternatives to content that may be missing at airtime.  Must be set to \"1\" and include a LinkedEventId that indicates which event this is a backup to.  Note that there is also a new AlternateEvent element that allows the definition of alternative content underneath a specific Event."
              },
              "PlayoutRestrictions": {
                "type": "array",
                "items": {
                  "type": "string"
                },
                "description": "Used to define what is allowed or restricted to the viewing of content in different venues (locations, devices, etc.) and the provisioning of alternative content when this happens.  Each Venue may have only one replacement option or null."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "type": "string"
              },
              "@excludeFromEPG": {
                "type": "boolean"
              }
            },
            "additionalProperties": false
          },
          "Series": {
            "type": "object",
            "properties": {
              "SeriesName": {
                "title": "SeriesName",
                "type": "string",
                "description": "The name assigned to represent a related group of produced content."
              },
              "EpisodeName": {
                "title": "EpisodeName",
                "type": "string",
                "description": "A distinct name (within the series) assigned by the producer of the content."
              },
              "EpisodeCode": {
                "title": "EpisodeCode",
                "type": "string",
                "description": "The identifier that uniquely specifies a title in a series"
              },
              "Season": {
                "title": "Season",
                "type": "object",
                "properties": {
                  "SeasonName": {
                    "title": "SeasonName",
                    "type": "string",
                    "description": "The name used to reference the season period"
                  },
                  "StartDate": {
                    "title": "StartDate",
                    "type": "string",
                    "format": "date",
                    "description": "Start date of the season"
                  },
                  "EndDate": {
                    "title": "EndDate",
                    "type": "string",
                    "format": "date",
                    "description": "End date of the season"
                  },
                  "SeasonCode": {
                    "title": "SeasonCode",
                    "type": "string",
                    "description": "Indicates the value for the season within the full episode code."
                  }
                },
                "additionalProperties": false,
                "required": [
                  "SeasonName"
                ],
                "description": "A date range that indicates the period of time in which the episode was originally produced"
              },
              "SeriesCode": {
                "title": "SeriesCode",
                "type": "string",
                "description": "The series prefix or code that applies to all episodes that are part of the series - eg. SESA for Sesame Street."
              },
              "EpisodeNumber": {
                "title": "EpisodeNumber",
                "type": "string",
                "description": "The value associated with the epsiode relative to the full EpisodeCode (eg. SESAHDBA0110 then this would be 0110).  May contain non-numeric characters."
              },
              "Producers": {
                "type": "array",
                "items": {
                  "type": "string"
                },
                "description": "Companies that are involved in the production or distribution of the series."
              },
              "Synopses": {
                "title": "Synopses",
                "type": "object",
                "properties": {
                  "Synopsis": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "@synopsisName": {
                          "type": "string"
                        },
                        "@synopsisMaxLength": {
                          "type": "integer"
                        },
                        "@synopsisPurpose": {
                          "type": "string"
                        }
                      },
                      "additionalProperties": false,
                      "required": []
                    },
                    "minItems": 1
                  }
                },
                "additionalProperties": false,
                "required": [
                  "Synopsis"
                ],
                "description": "Allow the addition of one or more synopses of various lengths and for different purposes in multiple languages. (v5.0)"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "type": "string"
              }
            },
            "additionalProperties": false,
            "required": [
              "SeriesName"
            ]
          }
        },
        "additionalProperties": false
      },
      "video": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/video.schema.json",
        "title": "video",
        "type": "object",
        "properties": {},
        "$defs": {
          "AFDData": {
            "type": "object",
            "properties": {
              "AFDCode": {
                "title": "AFDCode",
                "type": "integer",
                "minimum": 1,
                "pattern": "[0|1][0|1][0|1][0|1]",
                "description": "Four bits that indicate the code for the Active Format Description as referenced by SMPTE ST2016-1:2009."
              },
              "AFDAnnotation": {
                "title": "AFDAnnotation",
                "type": "object",
                "properties": {
                  "@CodedFrameType": {
                    "type": "string",
                    "enum": [
                      "4:3",
                      "16:9"
                    ]
                  }
                },
                "additionalProperties": false,
                "oneOf": [
                  {
                    "type": "object",
                    "properties": {
                      "AFDAnnotationIn4-3": {
                        "title": "AFDAnnotationIn4-3",
                        "$ref": "#/components/schemas/video/$defs/AFDDetails",
                        "description": "[0000]=Undefined\n[0001]=Reserved\n[0010]=16:9+Top+Letterbox\n[0011]=14:9+Top+Letterbox\n[0100]=Other+Centered+Letterbox\n[0101]=Reserved\n[0110]=Reserved\n[0111]=Reserved\n[1000]=4:3+Full Frame\n[1001]=4:3+Full Frame\n[1010]=16:9+Centered+Letterbox\n[1011]=14:9+Centered+Letterbox\n[1100]=Reserved\n[1101]=4:3+14:9 Centered+Full Frame\n[1110]=16:9+14:9 Centered+Letterbox\n[1111]=16:9+4:3 Centered+Letterbox"
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "AFDAnnotationIn4-3"
                    ]
                  },
                  {
                    "type": "object",
                    "properties": {
                      "AFDAnnotationIn16-9": {
                        "title": "AFDAnnotationIn16-9",
                        "$ref": "#/components/schemas/video/$defs/AFDDetails",
                        "description": "[0000]=Undefined\n[0001]=Reserved\n[0010]=16:9+Full Frame\n[0011]=14:9+Centered+Pillarbox\n[0100]=Other+Centered+Letterbox\n[0101]=Reserved\n[0110]=Reserved\n[0111]=Reserved\n[1000]=16:9+Full Frame\n[1001]=4:3+Centered+Pillarbox\n[1010]=16:9+Full Frame+Protected\n[1011]=14:9+Centered+Pillarbox\n[1100]=Reserved\n[1101]=4:3+14:9 Centered+Pillarbox\n[1110]=16:9+14:9 Centered+Full Frame\n[1111]=16:9+4:3 Centered+Full Frame"
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "AFDAnnotationIn16-9"
                    ]
                  }
                ],
                "required": [
                  "@CodedFrameType"
                ],
                "description": "Describes the AFD Code in textual form and indicates which coded frame type is being used as referenced by SMPTE ST2016-1:2009."
              },
              "BarData": {
                "title": "BarData",
                "type": "object",
                "properties": {
                  "@topBarFlag": {
                    "type": "boolean"
                  },
                  "@bottomBarFlag": {
                    "type": "boolean"
                  },
                  "@leftBarFlag": {
                    "type": "boolean"
                  },
                  "@rightBarFlag": {
                    "type": "boolean"
                  },
                  "@lineNumberEndOfTopBar": {
                    "type": "integer",
                    "minimum": 0,
                    "maximum": 16383
                  },
                  "@lineNumberStartOfBottomBar": {
                    "type": "integer",
                    "minimum": 0,
                    "maximum": 16383
                  },
                  "@pixelNumberEndOfLeftBar": {
                    "type": "integer",
                    "minimum": 0,
                    "maximum": 16383
                  },
                  "@pixelNumberStartOfRightBar": {
                    "type": "integer",
                    "minimum": 0,
                    "maximum": 16383
                  }
                },
                "additionalProperties": false,
                "description": "Used to define the structure of bar data in a video source as referenced by SMPTE ST2016-1:2009."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "description": "Used to describe both Active Format Description Codes, Shorthand Text Descriptions and Bar Data options. (v3.0)",
            "required": [
              "AFDCode"
            ]
          },
          "AFDDetails": {
            "type": "object",
            "properties": {
              "OriginalFrameType": {
                "title": "OriginalFrameType",
                "type": "string",
                "enum": [
                  "4:3",
                  "14:9",
                  "16:9",
                  "Other"
                ]
              },
              "AFDPosition": {
                "title": "AFDPosition",
                "type": "string",
                "enum": [
                  "Centered",
                  "Full Frame",
                  "Reserved",
                  "Top",
                  "Undefined"
                ]
              },
              "AFDStyle": {
                "title": "AFDStyle",
                "type": "string",
                "enum": [
                  "Full Frame",
                  "Letterbox",
                  "Pillarbox",
                  "Protected",
                  "Reserved",
                  "Undefined"
                ]
              }
            },
            "additionalProperties": false,
            "required": [
              "OriginalFrameType",
              "AFDPosition",
              "AFDStyle"
            ]
          },
          "ChromaSubsampling": {
            "type": "object",
            "description": "The practice of encoding images by implementing less resolution for chroma information than for luma information, taking advantage of the human visual system's lower acuity for color differences than for luminance. (v6.0)",
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "ChromaSubsample4-2-0": {
                    "title": "ChromaSubsample4-2-0",
                    "type": "object",
                    "properties": {
                      "Quantization4-2-0": {
                        "title": "Quantization4-2-0",
                        "type": "string",
                        "enum": [
                          "QE.1"
                        ],
                        "description": "Only QE.1 allowed"
                      },
                      "ColorComponents4-2-0": {
                        "title": "ColorComponents4-2-0",
                        "type": "string",
                        "enum": [
                          "Y'C'bC'r"
                        ],
                        "description": "Y'C'bC'r"
                      },
                      "Colorimetry4-2-0": {
                        "title": "Colorimetry4-2-0",
                        "type": "string",
                        "enum": [
                          "COLOR.3",
                          "COLOR.5",
                          "COLOR.7",
                          "COLOR.8"
                        ],
                        "description": "Note: COLOR.3 only applies to ITU-R BT.709 delivered material and COLOR.8 [DPP] corresponds to the HLG system specified in Recommendation ITU-R BT.2100"
                      },
                      "PixelBitDepth4-2-0": {
                        "title": "PixelBitDepth4-2-0",
                        "type": "integer",
                        "enum": [
                          "10"
                        ],
                        "description": "Only 10 allowed"
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "Quantization4-2-0",
                      "ColorComponents4-2-0",
                      "Colorimetry4-2-0",
                      "PixelBitDepth4-2-0"
                    ],
                    "description": "C'b and C'r are each subsampled at a factor of 2 both horizontally and vertically."
                  }
                },
                "additionalProperties": false,
                "required": [
                  "ChromaSubsample4-2-0"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "ChromaSubsample4-2-2": {
                    "title": "ChromaSubsample4-2-2",
                    "type": "object",
                    "properties": {
                      "Quantization4-2-2": {
                        "title": "Quantization4-2-2",
                        "type": "string",
                        "enum": [
                          "QE.1"
                        ],
                        "description": "Only QE.1 allowed"
                      },
                      "ColorComponents4-2-2": {
                        "title": "ColorComponents4-2-2",
                        "type": "string",
                        "enum": [
                          "Y'C'bC'r"
                        ],
                        "description": "Y'C'bC'r"
                      },
                      "Colorimetry4-2-2": {
                        "title": "Colorimetry4-2-2",
                        "type": "string",
                        "enum": [
                          "COLOR.3",
                          "COLOR.5",
                          "COLOR.7",
                          "COLOR.8"
                        ],
                        "description": "Note: COLOR.3 only applies to ITU-R BT.709 delivered material and COLOR.8 corresponds to the HLG system specified in Recommendation ITU-R BT.2100"
                      },
                      "PixelBitDepth4-2-2": {
                        "title": "PixelBitDepth4-2-2",
                        "type": "integer",
                        "enum": [
                          "10"
                        ],
                        "description": "Only 10 allowed"
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "Quantization4-2-2",
                      "ColorComponents4-2-2",
                      "Colorimetry4-2-2",
                      "PixelBitDepth4-2-2"
                    ],
                    "description": "The two chroma components are sampled at half the sample rate of luma: the horizontal chroma resolution is halved. This reduces the bandwidth of an uncompressed video signal by one-third with little to no visual difference."
                  }
                },
                "additionalProperties": false,
                "required": [
                  "ChromaSubsample4-2-2"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "ChromaSubsample4-4-4": {
                    "title": "ChromaSubsample4-4-4",
                    "type": "object",
                    "properties": {
                      "Quantization4-4-4": {
                        "title": "Quantization4-4-4",
                        "type": "string",
                        "enum": [
                          "QE.1",
                          "QE.2"
                        ],
                        "description": "Either QE.1 or QE.2"
                      },
                      "ColorComponents4-4-4": {
                        "title": "ColorComponents4-4-4",
                        "type": "string",
                        "enum": [
                          "R'G'B'"
                        ],
                        "description": "R'G'B'"
                      },
                      "Colorimetry4-4-4": {
                        "title": "Colorimetry4-4-4",
                        "type": "string",
                        "enum": [
                          "COLOR.5",
                          "COLOR.7",
                          "COLOR.8"
                        ],
                        "description": "Note: COLOR.8 corresponds to the HLG system specified in Recommendation ITU-R BT.2100"
                      },
                      "PixelBitDepth4-4-4": {
                        "title": "PixelBitDepth4-4-4",
                        "type": "integer",
                        "enum": [
                          "12"
                        ],
                        "description": "Only 12 allowed"
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "Quantization4-4-4",
                      "ColorComponents4-4-4",
                      "Colorimetry4-4-4",
                      "PixelBitDepth4-4-4"
                    ],
                    "description": "Each of the three Y'C'bC'r components have the same sample rate, thus there is no chroma subsampling."
                  }
                },
                "additionalProperties": false,
                "required": [
                  "ChromaSubsample4-4-4"
                ]
              }
            ]
          },
          "DynamicRange": {
            "type": "object",
            "description": "Used to indicate whether the video content has either a standard dynamic range (SDR) or a high dynamic range (HDR). (v7.0)",
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "SDR": {
                    "title": "SDR",
                    "type": "object",
                    "oneOf": [
                      {
                        "type": "object",
                        "properties": {
                          "BT.601": {
                            "title": "BT.601",
                            "type": "boolean",
                            "description": "Standard Definition Television with standard dynamic range"
                          }
                        },
                        "additionalProperties": false,
                        "required": [
                          "BT.601"
                        ]
                      },
                      {
                        "type": "object",
                        "properties": {
                          "BT.709": {
                            "title": "BT.709",
                            "type": "boolean",
                            "description": "High Definition Television with standard dynamic range"
                          }
                        },
                        "additionalProperties": false,
                        "required": [
                          "BT.709"
                        ]
                      },
                      {
                        "type": "object",
                        "properties": {
                          "BT.2020": {
                            "title": "BT.2020",
                            "type": "boolean",
                            "description": "Ultra High Definition Television with standard dynamic range"
                          }
                        },
                        "additionalProperties": false,
                        "required": [
                          "BT.2020"
                        ]
                      }
                    ],
                    "description": "Standard Dynamic Range"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "SDR"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "HDR": {
                    "title": "HDR",
                    "type": "object",
                    "oneOf": [
                      {
                        "type": "object",
                        "properties": {
                          "PQ": {
                            "title": "PQ",
                            "type": "object",
                            "oneOf": [
                              {
                                "type": "object",
                                "properties": {
                                  "StaticMetadata": {
                                    "title": "StaticMetadata",
                                    "type": "object",
                                    "properties": {
                                      "ST-2086": {
                                        "title": "ST-2086",
                                        "type": "object",
                                        "properties": {
                                          "DisplayPrimaries": {
                                            "title": "DisplayPrimaries",
                                            "type": "integer"
                                          },
                                          "ChromaticityWhitePoint": {
                                            "title": "ChromaticityWhitePoint",
                                            "type": "integer"
                                          },
                                          "MaxDispMasteringLuminance": {
                                            "title": "MaxDispMasteringLuminance",
                                            "type": "integer"
                                          },
                                          "MinDispMasteringLuminance": {
                                            "title": "MinDispMasteringLuminance",
                                            "type": "number"
                                          }
                                        },
                                        "additionalProperties": false,
                                        "required": [
                                          "DisplayPrimaries",
                                          "ChromaticityWhitePoint",
                                          "MaxDispMasteringLuminance",
                                          "MinDispMasteringLuminance"
                                        ],
                                        "description": "Mastering Display Color Volume, ST-2086"
                                      },
                                      "MAXCLL": {
                                        "title": "MAXCLL",
                                        "type": "number",
                                        "description": "Maximum Content Light Level - the luma of the brightest pixel."
                                      },
                                      "MAXFALL": {
                                        "title": "MAXFALL",
                                        "type": "number",
                                        "description": "Maximum Frame Average Light Level - the highest frame average brightness within the content."
                                      },
                                      "PrivateInformation": {
                                        "title": "PrivateInformation",
                                        "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
                                      }
                                    },
