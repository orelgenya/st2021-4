    "schemas": {
      "asrun": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/asrun.schema.json",
        "title": "asrun",
        "type": "object",
        "properties": {},
        "$defs": {
          "AsRunDetail": {
            "type": "object",
            "properties": {
              "Status": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/bxftypes/$defs/AsRunStatusType"
                },
                "minItems": 1,
                "description": "How the event was processed by the automation system"
              },
              "Type": {
                "title": "Type",
                "$ref": "#/components/schemas/bxftypes/$defs/ScheduleEventType",
                "description": "Enumerates the various types of asrun events."
              },
              "StartDateTime": {
                "title": "StartDateTime",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfDateTime",
                "description": "The actual time the event started."
              },
              "Duration": {
                "title": "Duration",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfDuration",
                "description": "The actual duration of the event as aired."
              },
              "EventNotes": {
                "title": "EventNotes",
                "$ref": "#/components/schemas/bxftypes/$defs/EventNotes",
                "description": "Used by the operator to indicate what may have happened to an event."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "required": [
              "Status",
              "Type",
              "StartDateTime",
              "Duration"
            ]
          },
          "BasicAsRun": {
            "type": "object",
            "properties": {
              "AsRunEventId": {
                "title": "AsRunEventId",
                "$ref": "#/components/schemas/eventdata/$defs/EventExtId",
                "description": "References the scheduled event ID unless the event was added manually in which case this the Null value should be used."
              },
              "Content": {
                "title": "Content",
                "$ref": "#/components/schemas/contentmetadata/$defs/ContentMetaData",
                "description": "Option specific reference to the content that aired used specifically when operator inserts content not originally scheduled."
              },
              "AsRunDetail": {
                "title": "AsRunDetail",
                "$ref": "#/components/schemas/asrun/$defs/AsRunDetail"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "required": [
              "AsRunEventId",
              "AsRunDetail"
            ]
          },
          "CompleteAsRun": {
            "type": "object",
            "properties": {
              "AsRunDetail": {
                "title": "AsRunDetail",
                "$ref": "#/components/schemas/asrun/$defs/AsRunDetail"
              }
            },
            "additionalProperties": false,
            "required": [
              "AsRunDetail"
            ]
          }
        },
        "additionalProperties": false
      },
      "audio": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/audio.schema.json",
        "title": "audio",
        "type": "object",
        "properties": {},
        "$defs": {
          "AudioChannel": {
            "type": "object",
            "properties": {
              "SoundfieldGroupLinkID": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
                },
                "description": "Used to link an AudioChannel to a specific SoundfieldGroup."
              },
              "AudioChannelType": {
                "title": "AudioChannelType",
                "type": "string",
                "enum": [
                  "Left",
                  "Center",
                  "Right",
                  "LFE",
                  "Left Surround",
                  "Right Surround",
                  "Left Side Surround",
                  "Right Side Surround",
                  "Left Rear Surround",
                  "Right Rear Surround ",
                  "Left Center",
                  "Right Center",
                  "Center Surround",
                  "Mono One",
                  "Mono Two",
                  "Left Total",
                  "Right Total",
                  "Left Sorrund Total",
                  "Right Surround Total",
                  "Surround",
                  "Control",
                  "Other"
                ],
                "description": "The type of labeling used for each AudioChannel such as LEFT, RIGHT, CENTER, etc. and further extended for UK requirements to include control channels.  (ST 428-12:2013; ST2067-8:2013)"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              },
              "@audioChannelID": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@audioChannelReference": {
                "type": "integer",
                "minimum": 1
              },
              "@directPCMTrack": {
                "type": "integer",
                "minimum": 1
              },
              "@directPCMTrackID": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              }
            },
            "additionalProperties": false,
            "description": "Distinct collection of sequenced audio samples that are intended for delivery to a single loudspeaker or other reproduction device. (v6.0)"
          },
          "Audios": {
            "type": "object",
            "description": "Extends PMCP AudiosType"
          },
          "Ac3AudioExt": {
            "type": "object",
            "description": "Extends PMCP Ac3Audio"
          },
          "AnalogAudio": {
            "type": "object",
            "properties": {
              "@audioReference": {
                "type": "integer",
                "minimum": 1
              },
              "@audioType": {
                "type": "string",
                "enum": [
                  "Mono",
                  "Stereo-Left",
                  "Stereo-Right"
                ]
              },
              "@audioLevel": {
                "type": "integer"
              },
              "@audioChannel": {
                "type": "integer",
                "minimum": 1
              },
              "@lang": {
                "type": "string"
              },
              "@secondaryAudioProgram": {
                "type": "boolean"
              },
              "@sapMode": {
                "type": "string",
                "enum": [
                  "Active",
                  "Silent"
                ]
              }
            },
            "additionalProperties": false,
            "description": "Enumerates the settings of audio included in analog content"
          },
          "Audio": {
            "type": "object",
            "properties": {
              "@voiceOver": {
                "type": "boolean"
              }
            },
            "additionalProperties": false,
            "description": "The base for all audio definitions",
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "Null": {
                    "title": "Null",
                    "type": "object",
                    "description": "No audio is associated to the media"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "Null"
                ]
              }
            ]
          },
          "AudioTransition": {
            "type": "object",
            "properties": {
              "AudioMode": {
                "title": "AudioMode",
                "$ref": "#/components/schemas/audio/$defs/AudioModeType",
                "description": "Indicates whether the audio should go over, under or is a breakaway"
              },
              "TransitionType": {
                "title": "TransitionType",
                "$ref": "#/components/schemas/audio/$defs/AudioTransitionEnumType",
                "description": "Indicates if the transition is a cut or a mix (crossfade)"
              },
              "TransitionRate": {
                "title": "TransitionRate",
                "$ref": "#/components/schemas/audio/$defs/AudioRateType",
                "description": "The speed of the transition, fast, medium or slow"
              },
              "AudioSwap": {
                "title": "AudioSwap",
                "type": "boolean",
                "description": "If set to True then the analog audio channels left and right are swapped."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "description": "Enumerates the settings to transition from one audio to another"
          },
          "DigitalAudio": {
            "type": "object",
            "properties": {
              "@audioReference": {
                "type": "integer",
                "minimum": 1
              },
              "@truePeak": {
                "type": "integer",
                "maximum": 0,
                "minimum": -146
              },
              "@measuredLoudness": {
                "type": "integer",
                "maximum": 0,
                "minimum": -146
              },
              "@measurementMethod": {
                "type": "string",
                "enum": [
                  "dBFS",
                  "LKFS",
                  "LUFS"
                ]
              },
              "@dialnorm": {
                "type": "integer",
                "minimum": 1,
                "maximum": 31
              },
              "@lowAudioLevels": {
                "type": "integer",
                "maximum": 0,
                "minimum": -146
              },
              "@audioEncodingRefID": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@loudnessMeasurementType": {
                "type": "string",
                "enum": [
                  "Program loudness",
                  "Max short-term loudness",
                  "Max momentary loudness"
                ]
              }
            },
            "additionalProperties": false,
            "description": "Enumerates the different types of digital audio streams. (v3.0)",
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "Ac3Audio": {
                    "title": "Ac3Audio",
                    "$ref": "#/components/schemas/audio/$defs/Ac3AudioExt"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "Ac3Audio"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "DEAudio": {
                    "title": "DEAudio",
                    "$ref": "#/components/schemas/audio/$defs/DigitalAudioAttribute"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "DEAudio"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "MPEGAACAudio": {
                    "title": "MPEGAACAudio",
                    "$ref": "#/components/schemas/audio/$defs/DigitalAudioAttribute"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "MPEGAACAudio"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "MPEGLayerIIAudio": {
                    "title": "MPEGLayerIIAudio",
                    "$ref": "#/components/schemas/audio/$defs/DigitalAudioAttribute"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "MPEGLayerIIAudio"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "PCMAudio": {
                    "title": "PCMAudio",
                    "type": "object",
                    "properties": {
                      "@exactBitRate": {
                        "type": "boolean"
                      },
                      "@bitRateKbps": {
                        "type": "string"
                      }
                    },
                    "additionalProperties": false
                  }
                },
                "additionalProperties": false,
                "required": [
                  "PCMAudio"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "DED2Audio": {
                    "title": "DED2Audio",
                    "$ref": "#/components/schemas/audio/$defs/DigitalAudioAttribute",
                    "description": "(v6.0)"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "DED2Audio"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "Ac4Audio": {
                    "title": "Ac4Audio",
                    "$ref": "#/components/schemas/audio/$defs/DigitalAudioAttribute",
                    "description": "(v6.0)"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "Ac4Audio"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "MPEGHAudio": {
                    "title": "MPEGHAudio",
                    "$ref": "#/components/schemas/audio/$defs/DigitalAudioAttribute",
                    "description": "(v6.0)"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "MPEGHAudio"
                ]
              }
            ]
          },
          "DigitalAudioAttribute": {
            "type": "object",
            "properties": {
              "@audioId": {
                "type": "string"
              },
              "@lang": {
                "type": "string"
              },
              "@numChannels": {
                "type": "string"
              },
              "@bitRateKbps": {
                "type": "string"
              },
              "@exactBitRate": {
                "type": "boolean"
              },
              "@surround": {
                "type": "boolean"
              },
              "@dualMono": {
                "type": "boolean"
              },
              "@muteOnSound": {
                "type": "boolean"
              }
            },
            "additionalProperties": false,
            "description": "Enumerates the parameters of a digital audio stream",
            "required": [
              "@audioId"
            ]
          },
          "GroupofSoundfieldGroups": {
            "type": "object",
            "properties": {
              "GroupContent": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                },
                "description": "Information about the content in the Group, which is common for all SoundfieldGroups in the Group of SoundfieldGroups. (V8.1)"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              },
              "@groupOfSoundfieldGroupsID": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              }
            },
            "additionalProperties": false,
            "description": "A group of groups allows encapsulation of SoundfieldGroups into defined streams. It is often used to classify the purpose of the audio such as Main Program, Alternate Program, etc.(v6.0)"
          },
          "Loudness": {
            "type": "object",
            "properties": {
              "MeasuredLoudness": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "@loudnessValue": {
                      "type": "integer",
                      "maximum": 0,
                      "minimum": -146
                    },
                    "@loudnessUnit": {
                      "type": "string",
                      "enum": [
                        "dBFS",
                        "LKFS",
                        "LUFS"
                      ]
                    },
                    "@measurementType": {
                      "type": "string",
                      "enum": [
                        "Program loudness",
                        "Max short-term loudness",
                        "Max momentary loudness"
                      ]
                    }
                  },
                  "additionalProperties": false
                },
                "description": "The measured loudness value of the SoundfieldGroup. Can be program loudness, maximum short-term loudness or maximum momentary loudness expressed by the measurement Type attribute. The unit attribute allows for various measurement units. (v8.1)"
              },
              "MeasuredMaximumTruePeak": {
                "title": "MeasuredMaximumTruePeak",
                "type": "integer",
                "maximum": 0,
                "minimum": -146,
                "description": "The measured maximumTruePeak - unit of the value is dBTP"
              },
              "DesiredLoudnessStandard": {
                "title": "DesiredLoudnessStandard",
                "type": "string",
                "enum": [
                  "ATSC A/85",
                  "EBU R128",
                  "OP 57",
                  "None"
                ],
                "description": "The Loudness standard that the SoundfieldGroup meets."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "description": "Indicates the loudness of the SoundfieldGroup as measured in various ways and using various standards. (v6.0)"
          },
          "MultiChannelAudioStreams": {
            "type": "object",
            "properties": {
              "GroupofSoundfieldGroups": {
                "type": "array",
                "items": {
                  "type": "object",
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/audio/$defs/GroupofSoundfieldGroups"
                    }
                  ]
                },
                "description": "A group of groups allows encapsulation of SoundfieldGroups into defined streams. It is often used to classify the purpose of the audio such as Main Program, Alternate Program, etc.(v6.0)"
              },
              "SoundfieldGroup": {
                "type": "array",
                "items": {
                  "type": "object",
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/audio/$defs/SoundfieldGroup"
                    }
                  ]
                },
                "description": "Used to organize a group of multiple audio channels that comprise the complete audio structure for the program, for example, Stereo, or Stereo-Spanish, or 5.1.  It may comprise a single audio stream using a specific encoding or multiple channels (Left, Right, Center LFE, etc.)  It can also comprise multiple complete streams assigned to various channels. (v8.1)"
              },
              "AudioChannel": {
                "type": "array",
                "items": {
                  "type": "object",
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/audio/$defs/AudioChannel"
                    }
                  ]
                },
                "description": "Distinct collection of sequenced audio samples that are intended for delivery to a single loudspeaker or other reproduction device. (v6.0)"
              },
              "AudioEncoding": {
                "title": "AudioEncoding",
                "$ref": "#/components/schemas/audio/$defs/DigitalAudio",
                "description": "The single audio encoding method used within this MCA across all AudioChannels included.  It can be either indicated at this level or alternatively referenced using the encodingReferenceID."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              },
              "@essenceReference": {
                "type": "integer",
                "minimum": 1
              },
              "@audioEncodingRefID": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@numberOfSoundfieldGroups": {
                "type": "integer",
                "minimum": 1
              },
              "@firstTrack": {
                "type": "integer",
                "minimum": 1
              },
              "@firstTrackID": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@lastTrack": {
                "type": "integer",
                "minimum": 1
              },
              "@lastTrackID": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              }
            },
            "additionalProperties": false,
            "description": "A collection of one or more audio streams with the same encoding method that further incorporates groups of audio channels in a specific format as defined in ST 377-4. If a data stream (MXF audio essence track) contains multiple encodings (e.g., PCM and Dolby E), then multiple MultiChannelAudioStreams must be used. (v8.1)"
          },
          "SoundfieldGroup": {
            "type": "object",
            "properties": {
              "GroupofSoundfieldGroupsLinkID": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
                },
                "description": "Used to link a SoundfieldGroup to a specific Group of SoundfieldGroups. (v8.1)"
              },
              "MultichannelType": {
                "title": "MultichannelType",
                "type": "string",
                "enum": [
                  "Mono",
                  "Dual Mono",
                  "Stereo",
                  "Lt-Rt",
                  "3.0",
                  "4.0",
                  "5.0",
                  "5.1",
                  "5.1EX",
                  "6.0",
                  "6.1",
                  "7.0",
                  "7.1DS",
                  "7.1SDS",
                  "Other"
                ],
                "description": "Describes the multichannel type of SoundfieldGroup.  For example MONO, STEREO, 5.1, etc. Can be sourced from MXF MCATagname of a SoundfieldGroup (e.g., AS-11 X1 MXF), if it contains this information.\n(ST 428-12:2013 and ST2067-8:2013)"
              },
              "AudioContent": {
                "title": "AudioContent",
                "type": "object",
                "properties": {
                  "AudioContentKind": {
                    "title": "AudioContentKind",
                    "type": "string",
                    "enum": [
                      "Primary",
                      "Secondary Audio Program",
                      "Hearing Impaired",
                      "Descriptive Video",
                      "Dialog",
                      "Music",
                      "Effects",
                      "Music and Effects",
                      "Optional Music and Effects",
                      "Program Narration",
                      "Optional Narration",
                      "Voice Over",
                      "Visually Impaired",
                      "Visually Impaired with control channel",
                      "Recorded Commentary",
                      "Live Commentary",
                      "International",
                      "Other"
                    ],
                    "description": "Describes the high level purpose or use of the audio content.  The assigned value can be sourced form MXF MCA Content (e.g. Video Description equals the Audio Descriprion term widely used in the UK).  If MCA content is not available, may be sourced from MCAContentKind."
                  },
                  "AudioContentUse": {
                    "title": "AudioContentUse",
                    "type": "string",
                    "enum": [
                      "Finished Composite",
                      "Intermediary Composite",
                      "Simplified",
                      "Singular"
                    ],
                    "description": "Describes the condition of the content (e.g. finished, intermediate) as a modifier to the AudioContentKind value and indicates its intended use. Value can be sourced from MXF MCA Use Class."
                  },
                  "AudioContentSubType": {
                    "title": "AudioContentSubType",
                    "type": "string",
                    "enum": [
                      "Director",
                      "Technical",
                      "Writer",
                      "Cast",
                      "Announcer",
                      "Commentator",
                      "Other"
                    ],
                    "description": "Describes particular aspects of the content, such as whether a commentary is a Director, Cast or Writer\u2019s commentary.  This property is absent if it is not relevant to a particular AudioContentKind value."
                  },
                  "PrimarySpokenlanguage": {
                    "title": "PrimarySpokenlanguage",
                    "type": "string",
                    "properties": {
                      "@dubbed": {
                        "type": "boolean"
                      }
                    },
                    "additionalProperties": false,
                    "required": [],
                    "description": "Intelligible primery spoken language that potentially distinguishes this Soundfield Group from another Soundfield Group. Value can be sourced form MXF MCA RFC 5646 Spoken Language."
                  },
                  "AdditionalSpokenLanguage": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "properties": {
                        "@dubbed": {
                          "type": "boolean"
                        }
                      },
                      "additionalProperties": false,
                      "required": []
                    },
                    "description": "Additional intelligible spoken languages that are present in the audio, but are not considered primary."
                  },
                  "PrivateInformation": {
                    "title": "PrivateInformation",
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
                  }
                },
                "additionalProperties": false,
                "description": "Additional details concerning the language spoken and the purpose of the audio."
              },
              "Loudness": {
                "title": "Loudness",
                "type": "object",
                "allOf": [
                  {
                    "$ref": "#/components/schemas/audio/$defs/Loudness"
                  }
                ],
                "description": "Indicates the loudness of the SoundfieldGroup as measured in various ways and using various standards. (v6.0)"
              },
              "AudioMetadata": {
                "title": "AudioMetadata",
                "type": "object",
                "properties": {
                  "AudioMetadataInVANC": {
                    "title": "AudioMetadataInVANC",
                    "type": "boolean",
                    "description": "Indicates that audio metadata is in VANC (required if multichannel audio is in an uncompressed stream) ST 2020-2"
                  },
                  "AudioMetadataInAudioStream": {
                    "title": "AudioMetadataInAudioStream",
                    "type": "boolean",
                    "description": "Indicates that audio metadata is in the compressed audio stream."
                  },
                  "AudioMetadataInRDD6XML": {
                    "title": "AudioMetadataInRDD6XML",
                    "type": "boolean"
                  },
                  "PrivateInformation": {
                    "title": "PrivateInformation",
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
                  }
                },
                "additionalProperties": false,
                "description": "Flags indicating whether the audio metadata in stored in the VANC or the Audio Stream or if it is contained in the RDD6 XML."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              },
              "@soundfieldGroupID": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@numberOfChannels": {
                "type": "integer"
              },
              "@firstPCMTrack": {
                "type": "integer",
                "minimum": 1
              },
              "@firstPCMTrackID": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@lastPCMTrack": {
                "type": "integer",
                "minimum": 1
              },
              "@lastPCMTrackID": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              }
            },
            "additionalProperties": false,
            "description": "Used to organize a group of multiple audio channels that comprise the complete audio structure for the program, for example, Stereo, or Stereo-Spanish, or 5.1.  It may comprise a single audio stream using a specific encoding or multiple channels (Left, Right, Center LFE, etc.)  It can also comprise multiple complete streams assigned to various channels. (v8.1)"
          },
          "TSAudio": {
            "type": "object",
            "description": "Enumerates the parameters of digital audio in a transport stream",
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "Null": {
                    "title": "Null",
                    "type": "object",
                    "description": "No audio is associated to the media"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "Null"
                ]
              }
            ]
          },
          "AudioModeType": {
            "type": "string",
            "enum": [
              "Breakaway",
              "Over",
              "Under"
            ]
          },
          "AudioRateType": {
            "type": "string",
            "enum": [
              "Fast",
              "Medium",
              "Slow"
            ]
          },
          "AudioTransitionEnumType": {
            "type": "string",
            "enum": [
              "Cut",
              "Mix"
            ]
          }
        },
        "additionalProperties": false
      },
      "bxfcaptions": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/bxfcaptions.schema.json",
        "title": "bxfcaptions",
        "type": "object",
        "properties": {},
        "$defs": {
          "AccessServices": {
            "type": "object",
            "properties": {
              "ClosedCaptioning": {
                "title": "ClosedCaptioning",
                "type": "object",
                "properties": {
                  "IMSC1": {
                    "title": "IMSC1",
                    "type": "boolean",
                    "description": "Internet Media Subtitles and Captions 1.0, as defined by the W3C"
                  },
                  "EBU-TT": {
                    "title": "EBU-TT",
                    "type": "boolean",
                    "description": "Captions may be delivered as an IMSC 1.0 constrained TTML document encapsulated as an MXF track.  The IMSC 1.0 captions additionally constrained to meet the requirements of EBU-TT (EBU-Tech 3350/3390)"
                  },
                  "EBU-STL": {
                    "title": "EBU-STL",
                    "type": "boolean",
                    "description": "If EBU STL (EBU-Tech 3265) is to be carried in addition to the IMSC 1.0 TTML, it will be encapsulated as an MXF Track File according to SMPTE ST 2075."
                  },
                  "CEA-608": {
                    "title": "CEA-608",
                    "type": "boolean",
                    "description": "If CTA 608-708 Captioning is to be carried in addition to the IMSC 1.0 TTML, it will be encapsulated as an MXF Track File according to SMPTE ST 2052 and referenced by an Ancillary Data Essence Virtual Track according to SMPTE ST 2067-2."
                  },
                  "CEA-708": {
                    "title": "CEA-708",
                    "type": "boolean",
                    "description": "If CEA 608-708 Captioning is to be carried in addition to the IMSC 1.0 TTML, it will be encapsulated as an MXF Track File according to SMPTE ST 2052 and referenced by an Ancillary Data Essence Virtual Track according to SMPTE ST 2067-2."
                  }
                },
                "additionalProperties": false,
                "required": [
                  "IMSC1",
                  "EBU-TT",
                  "EBU-STL",
                  "CEA-608",
                  "CEA-708"
                ],
                "description": "Indicator of whether closed subtitles or captioning is provided and which type or types are included."
              },
              "AudioDescription_DVS": {
                "title": "AudioDescription_DVS",
                "type": "boolean",
                "description": "Indicator of whether Audio Description (AD) also known as Described Video Service (DVS) or Video Description is provided."
              },
              "Signing": {
                "title": "Signing",
                "type": "boolean",
                "description": "Indicator of whether signed video is provided."
              }
            },
            "additionalProperties": false,
            "description": "Indicators of the type of access services provided as part of the Library Master content. (V6.0)"
          },
          "AlternativeCaptions": {
            "type": "object",
            "properties": {
              "LMTLanguage": {
                "title": "LMTLanguage",
                "$ref": "#/components/schemas/bxftypes/$defs/LMTLanguageType",
                "description": "Language used for the caption service, more specific than captionLanguage attribute. (v8.1)"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              },
              "@captionID": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@captionTypeName": {
                "type": "string",
                "enum": [
                  "EBU-STL",
                  "EBU-TT",
                  "IMSC",
                  "SAMI",
                  "SMPTE-TT",
                  "SRT",
                  "WebVTT",
                  "Other"
                ]
              },
              "@captionName": {
                "type": "string"
              },
              "@captionServiceType": {
                "type": "string",
                "enum": [
                  "Hard of Hearing",
                  "Translation"
                ]
              },
              "@captionProfile": {
                "type": "string"
              },
              "@captionLanguage": {
                "type": "string"
              },
              "@captionVersion": {
                "type": "string"
              }
            },
            "additionalProperties": false,
            "description": "Additional caption and subtitle options as used worldwide as well as the ability to extend to other customized types. (v6.0)"
          },
          "BXFCaptionOP42": {
            "type": "object",
            "properties": {
              "WSTpage": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "@pageNumber": {
                      "type": "integer",
                      "minimum": 1
                    },
                    "@lang": {
                      "type": "string"
                    },
                    "@captionServiceType": {
                      "type": "string",
                      "enum": [
                        "Hard of Hearing",
                        "Translation"
                      ]
                    }
                  },
                  "additionalProperties": false
                }
              },
              "@lineNumberinVB": {
                "type": "string",
                "enum": [
                  "21/334",
                  "22/335"
                ]
              }
            },
            "additionalProperties": false,
            "description": "Describes Teletext Based Closed Captions According FreeTv Austarlia OP 42. (v6.0)"
          },
          "BXFCaptionOP47": {
            "type": "object",
            "properties": {
              "WSTpage": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "@pageNumber": {
                      "type": "integer",
                      "minimum": 1
                    },
                    "@lang": {
                      "type": "string"
                    },
                    "@captionServiceType": {
                      "type": "string",
                      "enum": [
                        "Hard of Hearing",
                        "Translation"
                      ]
                    }
                  },
                  "additionalProperties": false
                }
              }
            },
            "additionalProperties": false,
            "description": "Describes Teletext Based Closed Captions According FreeTv Austarlia OP 47 Note that when used, DigitalVideo and CaptionsInVANC should both be set to True in VideoType. (v6.0)"
          },
          "BxfCaptions": {
            "type": "object",
            "description": "Caption Service Descriptor (A/65B 6.9.3)",
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "Null": {
                    "title": "Null",
                    "type": "object",
                    "description": "Means that there is no caption service"
                  }
                },
                "additionalProperties": false
              }
            ]
          },
          "BxfCaption608": {
            "type": "object"
          },
          "BxfCaption708": {
            "type": "object"
          }
        },
        "additionalProperties": false
      },
      "bxfchannel": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/bxfchannel.schema.json",
        "title": "bxfchannel",
        "type": "object",
        "properties": {},
        "$defs": {
          "Channel": {
            "type": "object"
          }
        },
        "additionalProperties": false
      },
      "bxfcontentid": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/bxfcontentid.schema.json",
        "title": "bxfcontentid",
        "type": "object",
        "properties": {},
        "$defs": {
          "BxfAlternateId": {
            "type": "string",
            "properties": {
              "@authoritativeSource": {
                "type": "string"
              }
            },
            "additionalProperties": false,
            "required": []
          },
          "BxfHouseNumber": {
            "type": "object",
            "properties": {
              "@DayPattern": {
                "$ref": "#/components/schemas/bxftypes/$defs/DayPattern"
              },
              "@endOfDay": {
                "type": "integer",
                "minimum": 0,
                "maximum": 23
              },
              "@uniqueFor": {
                "type": "integer",
                "minimum": 1,
                "maximum": 511
              }
            },
            "additionalProperties": false,
            "description": "Generally user defined at a specific site and will only be consistent within the defined group of users  There is no guarantee of transportability or uniqueness.  The endOfDay and uniqueFor attributes are included for consistency under the ATSC  A-57B definition for HouseNumber.",
            "required": []
          },
          "BxfContentId": {
            "type": "object",
            "description": "Groups several content IDs that may be used simultaneously to label and reference a show",
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "AlternateId": {
                    "type": "array",
                    "items": {
                      "$ref": "#/components/schemas/bxfcontentid/$defs/BxfAlternateId"
                    },
                    "minItems": 1,
                    "description": "Any proprietary string other than the house number used to identify the material locally or globally"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "AlternateId"
                ]
              }
            ]
          }
        },
        "additionalProperties": false
      },
      "bxfisan": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/bxfisan.schema.json",
        "title": "bxfisan",
        "type": "object",
        "properties": {},
        "$defs": {
          "BxfIsan": {
            "type": "object"
          }
        },
        "additionalProperties": false
      },
      "bxfparentalrating": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/bxfparentalrating.schema.json",
        "title": "bxfparentalrating",
        "type": "object",
        "properties": {},
        "$defs": {
          "BxfParentalRating": {
            "type": "object"
          }
        },
        "additionalProperties": false
      },
      "bxfschema": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/bxfschema.schema.json",
        "title": "bxfschema",
        "type": "object",
        "properties": {},
        "$defs": {
          "BxfMessage": {
            "title": "BxfMessage",
            "type": "object",
            "properties": {
              "@id": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@dateTime": {
                "type": "string",
                "format": "date-time"
              },
              "@messageType": {
                "$ref": "#/components/schemas/bxftypes/$defs/MessageType"
              },
              "@origin": {
                "type": "string",
                "minLength": 1,
                "maxLength": 255
              },
              "@originType": {
                "$ref": "#/components/schemas/bxftypes/$defs/OriginType"
              },
              "@userName": {
                "type": "string",
                "minLength": 1,
                "maxLength": 255
              },
              "@password": {},
              "@destination": {
                "type": "string"
              },
              "@destinationId": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@destinationType": {
                "$ref": "#/components/schemas/bxftypes/$defs/DestinationType"
              },
              "@originId": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@originMessageId": {
                "$ref": "#/components/schemas/bxftypes/$defs/Uuid"
              },
              "@status": {
                "$ref": "#/components/schemas/bxftypes/$defs/BxfStatus"
              }
            },
            "additionalProperties": false,
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "BxfData": {
                    "title": "BxfData",
                    "type": "object",
                    "properties": {
                      "JobDetail": {
                        "type": "array",
                        "items": {
                          "$ref": "#/components/schemas/jobdetail/$defs/JobDetail"
                        },
                        "description": "Allows the message to assign job information.  If more than one company or process for a job, enter multiple records and link with jobId.  If one job is dependent on the completion of another, link using jobID and jobDependency. (v3.0)"
                      },
                      "PrivateInformation": {
                        "title": "PrivateInformation",
                        "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
                      }
                    },
                    "additionalProperties": false,
                    "oneOf": [
                      {
                        "type": "object",
                        "properties": {
                          "ContentTransfer": {
                            "type": "array",
                            "items": {
                              "$ref": "#/components/schemas/contenttransfer/$defs/ContentTransfer"
                            },
                            "minItems": 1,
                            "description": "Used to transfer or transcode media from one location to another location"
                          }
                        },
                        "additionalProperties": false,
                        "required": [
                          "ContentTransfer"
                        ]
                      },
                      {
                        "type": "object",
                        "properties": {
                          "Schedule": {
                            "type": "array",
                            "items": {
                              "$ref": "#/components/schemas/schedule/$defs/Schedule"
                            },
                            "minItems": 1,
                            "description": "Used to describe a specific list of content in a linear playout sequence"
                          }
                        },
                        "additionalProperties": false,
                        "required": [
                          "Schedule"
                        ]
                      },
                      {
                        "type": "object",
                        "properties": {
                          "Format": {
                            "type": "array",
                            "items": {
                              "$ref": "#/components/schemas/format/$defs/Format"
                            },
                            "minItems": 1,
                            "description": "The definition of the empty structure of a program as used by the traffic system to construct a schedule grid."
                          }
                        },
                        "additionalProperties": false,
                        "required": [
                          "Format"
                        ]
                      },
                      {
                        "type": "object",
                        "properties": {
                          "Content": {
                            "type": "array",
                            "items": {
                              "$ref": "#/components/schemas/content/$defs/Content"
                            },
                            "minItems": 1,
                            "description": "Used to describe the content at a specific location"
                          }
                        },
                        "additionalProperties": false,
                        "required": [
                          "Content"
                        ]
                      },
                      {
                        "type": "object",
                        "properties": {
                          "Configuration": {
                            "type": "array",
                            "items": {
                              "$ref": "#/components/schemas/configuration/$defs/Configuration"
                            },
                            "minItems": 1,
                            "description": "Used to describe the configuration values of a system"
                          }
                        },
                        "additionalProperties": false,
                        "required": [
                          "Configuration"
                        ]
                      },
                      {
                        "type": "object",
                        "properties": {
                          "TrafficInstructions": {
                            "type": "array",
                            "items": {
                              "$ref": "#/components/schemas/jobdetail/$defs/TrafficInstructions"
                            },
                            "minItems": 1,
                            "description": "Used to describe traffic instructions to a single or multiple stations for multiple content.  Requires stations to be defined under a Job. (v3.0)"
                          }
                        },
                        "additionalProperties": false,
                        "required": [
                          "TrafficInstructions"
                        ]
                      },
                      {
                        "type": "object",
                        "properties": {
                          "QCProfiles": {
                            "type": "array",
                            "items": {
                              "$ref": "#/components/schemas/qualitycontrol/$defs/QualityControl"
                            },
                            "minItems": 1,
                            "description": "Used to setup quality control profiles or do to specific QC based work. (v5.0)"
                          }
                        },
                        "additionalProperties": false,
                        "required": [
                          "QCProfiles"
                        ]
                      }
                    ],
                    "description": "Used to perform actions or supply information to another system."
                  }
                },
                "additionalProperties": false,
                "required": [
                  "BxfData"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "BxfQuery": {
                    "title": "BxfQuery",
                    "type": "object",
                    "properties": {
                      "WhereClause": {
                        "title": "WhereClause",
                        "$ref": "#/components/schemas/bxftypes/$defs/QueryString",
                        "description": "Simple SQL statements using BxfData elements and restricted by the format specified by QueryStringType (see BxfTypes)."
                      },
                      "ReturnStructure": {
                        "type": "array",
                        "items": {
                          "$ref": "#/components/schemas/bxftypes/$defs/QueryStringIdentifier"
                        },
                        "minItems": 1,
                        "description": "Describes the form of data you want returned into the BxfQueryResponse based on the format specified by QueryStringIdentifierType (see BxfTypes)."
                      },
                      "@requestChunking": {
                        "type": "boolean"
                      },
                      "@memoryLimit": {
                        "type": "integer"
                      }
                    },
                    "additionalProperties": false,
                    "required": [
                      "WhereClause",
                      "ReturnStructure"
                    ],
                    "description": "Used to describe a SQL statement which when applied to another system's database returns data for the structure designated by the ReturnStructure into BxfQueryResponse."
                  }
                },
                "additionalProperties": false,
                "required": [
                  "BxfQuery"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "BxfQueryResponse": {
                    "title": "BxfQueryResponse",
                    "type": "object",
                    "properties": {
                      "@chunkingFlag": {
                        "type": "boolean"
                      },
                      "@itemNumber": {
                        "type": "integer",
                        "minimum": 1
                      },
                      "@totalItems": {
                        "type": "integer",
                        "minimum": 1
                      }
                    },
                    "additionalProperties": true,
                    "description": "Used to respond to a BxfQuery request using the structure specified in ReturnStructure and the elemental definitions under BxfData."
                  }
                },
                "additionalProperties": false,
                "required": [
                  "BxfQueryResponse"
                ]
              }
            ],
            "required": [
              "@id",
              "@dateTime",
              "@messageType",
              "@origin",
              "@originType",
              "@userName"
            ],
            "description": "The root for all BXF messages."
          }
        },
        "additionalProperties": false
      },
      "bxftypes": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "http://smpte-ra.org/schemas/2021/2023/BXF/bxftypes.schema.json",
        "title": "bxftypes",
        "type": "object",
        "properties": {},
        "$defs": {
          "BxfAddress": {
            "type": "object",
            "properties": {
              "LocationName": {
                "title": "LocationName",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
              },
              "Street1": {
                "title": "Street1",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
              },
              "Street2": {
                "title": "Street2",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
              },
              "Street3": {
                "title": "Street3",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
              },
              "City": {
                "title": "City",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
              },
              "StateProv": {
                "title": "StateProv",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
              },
              "Country": {
                "title": "Country",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
              },
              "PostalCode": {
                "title": "PostalCode",
                "type": "string"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "description": "Address details",
            "required": [
              "LocationName",
              "Street1",
              "City",
              "StateProv",
              "PostalCode"
            ]
          },
          "BxfCompany": {
            "type": "object",
            "properties": {
              "CompanyName": {
                "title": "CompanyName",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "The name of the company"
              },
              "CompanyType": {
                "title": "CompanyType",
                "type": "string",
                "enum": [
                  "Advertiser",
                  "Agency",
                  "Cable Network",
                  "Interconnect Content Distributor",
                  "Local Cable System",
                  "Producer",
                  "Program Distributor",
                  "Radio Network",
                  "Radio Station",
                  "MSO",
                  "MVPD",
                  "Satellite Service",
                  "TV Network",
                  "TV Station",
                  "Other"
                ],
                "description": "Used to designate the type of company such as an agency, advertiser, third party processor, station, network, producer (see enumerations)."
              },
              "CompanyDetails": {
                "title": "CompanyDetails",
                "type": "object",
                "properties": {
                  "Identifiers": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "Identifier": {
                          "title": "Identifier",
                          "type": "string",
                          "description": "Actual identifier for the company"
                        },
                        "AuthoritativeIdSource": {
                          "title": "AuthoritativeIdSource",
                          "type": "string",
                          "description": "The industry standards body or other source for the identification value listed for the company (e.g. 4A's ID, FCC Call Sign, IRS EIN#, etc.) (See Configuration Section in BXF Protocol Documentation)"
                        }
                      },
                      "additionalProperties": false,
                      "required": [
                        "Identifier",
                        "AuthoritativeIdSource"
                      ]
                    },
                    "minItems": 1
                  },
                  "Locations": {
                    "type": "array",
                    "items": {
                      "$ref": "#/components/schemas/bxftypes/$defs/BxfAddress"
                    }
                  },
                  "Contacts": {
                    "type": "array",
                    "items": {
                      "$ref": "#/components/schemas/bxftypes/$defs/BxfContact"
                    }
                  }
                },
                "additionalProperties": false,
                "required": [
                  "Identifiers"
                ],
                "description": "Used to identify the company using specific identifiers and provide details about addresses and contacts associated with the company"
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "description": "Defines all the attributes required for a company",
            "required": [
              "CompanyName",
              "CompanyDetails"
            ]
          },
          "BxfContact": {
            "type": "object",
            "properties": {
              "ContactSalutation": {
                "title": "ContactSalutation",
                "type": "object"
              },
              "ContactFirstName": {
                "title": "ContactFirstName",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
              },
              "ContactLastName": {
                "title": "ContactLastName",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
              },
              "ContactSuffix": {
                "title": "ContactSuffix",
                "type": "object"
              },
              "ContactJobTitle": {
                "title": "ContactJobTitle",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
              },
              "Locations": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/bxftypes/$defs/BxfAddress"
                }
              },
              "Phones": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "PhoneNumber": {
                      "title": "PhoneNumber",
                      "type": "string"
                    },
                    "PhoneType": {
                      "title": "PhoneType",
                      "type": "string",
                      "enum": [
                        "Business",
                        "Home",
                        "Mobile",
                        "Alternate",
                        "Fax",
                        "Other"
                      ]
                    }
                  },
                  "additionalProperties": false,
                  "required": [
                    "PhoneNumber"
                  ]
                }
              },
              "EMails": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "Email": {
                      "title": "Email",
                      "type": "object",
                      "properties": {
                        "@primaryFlag": {
                          "type": "boolean"
                        }
                      },
                      "additionalProperties": false,
                      "allOf": [
                        {
                          "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                        }
                      ],
                      "required": []
                    },
                    "EmailType": {
                      "title": "EmailType",
                      "type": "string",
                      "enum": [
                        "Alternate",
                        "Home",
                        "Office",
                        "Other"
                      ]
                    }
                  },
                  "additionalProperties": false,
                  "required": [
                    "Email"
                  ]
                }
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              }
            },
            "additionalProperties": false,
            "description": "A contact is a person that is being referenced including phone, email and address details",
            "required": [
              "ContactFirstName",
              "ContactLastName"
            ]
          },
          "BxfCoverage": {
            "type": "object",
            "properties": {
              "CoverageName": {
                "title": "CoverageName",
                "type": "string",
                "description": "ZIPCODE 10022"
              },
              "TypeofCoverage": {
                "title": "TypeofCoverage",
                "type": "string",
                "enum": [
                  "City",
                  "Country",
                  "Market",
                  "DMA",
                  "Zipcode"
                ],
                "description": "Specifies the type of units used to define the coverage using a specific enumeration. (e.g. Zip code)"
              },
              "CoverageId": {
                "title": "CoverageId",
                "type": "string",
                "description": "The identifier within the type of units (e.g. 10022)"
              },
              "IncludeRestrictFlag": {
                "title": "IncludeRestrictFlag",
                "type": "string",
                "enum": [
                  "Include",
                  "Restrict"
                ],
                "description": "Indicates if this is included or excluded from the definition of the coverage for the Station. (e.g. Include)"
              }
            },
            "additionalProperties": false,
            "description": "An area of physical locations that represent the coverage for a broadcast station or the areas of distribution for a distributor of media content.",
            "required": [
              "CoverageName",
              "TypeofCoverage",
              "CoverageId",
              "IncludeRestrictFlag"
            ]
          },
          "BxfDateTime": {
            "type": "object",
            "description": "Allows either SMPTE or UTC based date-time notation",
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "SmpteDateTime": {
                    "title": "SmpteDateTime",
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfSmpteDateTime"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "SmpteDateTime"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "UtcDateTime": {
                    "title": "UtcDateTime",
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfUtcDateTime"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "UtcDateTime"
                ]
              }
            ]
          },
          "BxfDaypart": {
            "type": "object",
            "properties": {
              "DaypartDetail": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "DayOfWeek": {
                      "title": "DayOfWeek",
                      "$ref": "#/components/schemas/bxftypes/$defs/DayPattern",
                      "description": "A 7 element binary representation of the days of the week in Monday-Sunday order where a 1 includes the day and a 0 excludes the day \n(e.g. 1 1 1 1 1 0 0 = M-F)"
                    },
                    "StartTime": {
                      "title": "StartTime",
                      "$ref": "#/components/schemas/bxftypes/$defs/BxfSmpteTime",
                      "description": "The start time of the daypart for all  days specified in the DayofWeek element.  If not specified assume the Start of Broadcast Day."
                    },
                    "EndTime": {
                      "title": "EndTime",
                      "$ref": "#/components/schemas/bxftypes/$defs/BxfSmpteTime",
                      "description": "The end time of the daypart for all  days specified in the DayofWeek element.  If not specified assume the End of Broadcast Day."
                    },
                    "@localTimeZoneFlag": {
                      "type": "boolean"
                    },
                    "@audienceDeficiencyUnit": {
                      "type": "boolean"
                    }
                  },
                  "additionalProperties": false,
                  "required": [
                    "DayOfWeek",
                    "@localTimeZoneFlag"
                  ]
                }
              },
              "DaypartName": {
                "title": "DaypartName",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Optional name that can be used to reference this daypart definition."
              },
              "StartDate": {
                "title": "StartDate",
                "type": "string",
                "format": "date",
                "description": "The start date that the daypart is valid or can be used for the specified content."
              },
              "EndDate": {
                "title": "EndDate",
                "type": "string",
                "format": "date",
                "description": "The end date that the daypart is valid or can be used for the specified content.  If not specified it remains valid until further notice."
              },
              "DaypartComment": {
                "title": "DaypartComment",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Optional comments that can be added to the daypart definition."
              },
              "PrivateInformation": {
                "title": "PrivateInformation",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfPrivateInformation"
              },
              "@excludeFlag": {
                "type": "boolean"
              }
            },
            "additionalProperties": false,
            "description": "A defined range of days, for one or more time period ranges and optionally dates that can be used to include or exclude for scheduling of content.  Note that it is possible to create illogical periods of time when potentially crossing the start of the broadcast day or crossing midnight depending on the system ingesting the definition."
          },
          "BxfDuration": {
            "type": "object",
            "description": "Duration can be expressed using either SMPTE time code or xs:duration",
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "SmpteDuration": {
                    "title": "SmpteDuration",
                    "$ref": "#/components/schemas/bxftypes/$defs/BxfSmpteTime"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "SmpteDuration"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "UtcDuration": {
                    "title": "UtcDuration",
                    "type": "string"
                  }
                },
                "additionalProperties": false,
                "required": [
                  "UtcDuration"
                ]
              }
            ]
          },
          "BxfExtensions": {
            "type": "object",
            "properties": {
              "ItemValue": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "@itemName": {
                      "type": "string"
                    },
                    "@itemType": {
                      "type": "string"
                    },
                    "@dataType": {
                      "type": "string"
                    }
                  },
                  "additionalProperties": false,
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                    }
                  ],
                  "required": [
                    "@itemName",
                    "@itemType"
                  ]
                },
                "minItems": 1,
                "description": "A value for the metadata type (e.g. 2011 Oscar for Best Actor)"
              },
              "@extensionType": {
                "type": "string"
              }
            },
            "additionalProperties": false,
            "description": "Used to describe customized metadata using data pairs and optionally a validation data type. (v3.0)",
            "required": [
              "ItemValue",
              "@extensionType"
            ]
          },
          "BxfPrivateInformation": {
            "type": "object",
            "description": "Any sequence of well-formed private XML elements"
          },
          "BxfSmpteTime": {
            "type": "object",
            "properties": {
              "SmpteTimeCode": {
                "title": "SmpteTimeCode",
                "$ref": "#/components/schemas/bxftypes/$defs/Smpte258MTimeCode",
                "description": "Specifies duration in the format HH:MM:SSpFF where \"p\" can be either a \":\" \";\" \",\" or \".\" to indicate drop frame or non-drop frame.  For details refer to SMPTE 258M, clause 8."
              },
              "@frameRate": {
                "type": "number"
              },
              "@framecount": {
                "type": "integer"
              }
            },
            "additionalProperties": false,
            "description": "Used for time duration or offset (V5.0 added support for 60 fps)",
            "required": [
              "SmpteTimeCode"
            ]
          },
          "BxfSmpteDateTime": {
            "type": "object",
            "properties": {
              "@broadcastDate": {
                "type": "string",
                "format": "date"
              },
              "@utcStartofBroadcastDay": {
                "type": "string",
                "format": "date-time"
              }
            },
            "additionalProperties": false,
            "description": "Used for date-time entry in the schema",
            "allOf": [
              {
                "$ref": "#/components/schemas/bxftypes/$defs/BxfSmpteTime"
              }
            ],
            "required": [
              "@broadcastDate"
            ]
          },
          "BxfStation": {
            "type": "object",
            "properties": {
              "StationId": {
                "title": "StationId",
                "type": "string",
                "description": "A unique identifier within the context of this message to be used in conjunction with the InstructionMap element."
              },
              "StationName": {
                "title": "StationName",
                "$ref": "#/components/schemas/bxftypes/$defs/BxfText",
                "description": "Name used to commonly reference the station, network or other entity performing a job."
              },
              "StationCallSign": {
                "title": "StationCallSign",
                "type": "string",
                "maxLength": 4,
                "minLength": 3,
                "description": "Optional federal designation for an over the air broadcast station consisting of 3 to 4 characters. (e.g. WHN or KABC or CJON)"
              },
              "StationType": {
                "title": "StationType",
                "type": "string",
                "enum": [
                  "Cable MSO",
                  "Content Distributor",
                  "Internet Distributor",
                  "Radio Broadcast",
                  "Radio Network",
                  "Satellite Network",
                  "Telco Distributor",
                  "TV Broadcast",
                  "TV Network",
                  "Other"
                ],
                "description": "List of enumerated types of JobPerformers that accept video and/or audio based advertising content."
              },
              "DistributionPlatform": {
                "type": "array",
                "items": {
                  "type": "string",
                  "enum": [
                    "AM",
                    "FM",
                    "Internet",
                    "Mobile",
                    "TV",
                    "Other"
                  ]
                },
                "description": "Methods of distribution used by the Station."
              },
              "Ownership": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "@percentOwnership": {
                      "type": "integer",
                      "minimum": 1,
                      "maximum": 100
                    }
                  },
                  "additionalProperties": false,
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/bxftypes/$defs/BxfCompany"
                    }
                  ],
                  "required": []
                },
                "description": "The company or companies that own the Station."
              },
              "Contacts": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/bxftypes/$defs/BxfContact"
                },
                "description": "A list of contacts or personnel associated with the Station."
              },
              "Coverage": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "CoverageChildren": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/bxftypes/$defs/BxfCoverage"
                      },
                      "description": "The children of the definition that describe the coverage using a different TypeofCoverage (e.g. Zip code List)"
                    }
                  },
                  "additionalProperties": false,
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/bxftypes/$defs/BxfCoverage"
                    }
                  ],
                  "required": []
                },
                "description": "The definition using legally defined areas (e.g. Zip codes, DMA's, etc.) of the coverage provided by the station for a specific signal or distribution of their content."
              }
            },
            "additionalProperties": false,
            "description": "A transmitter or distributer of media content either over the air or by other means",
            "required": [
              "StationId",
              "StationName"
            ]
          },
          "BxfText": {
            "type": "string",
            "properties": {
              "@lang": {
                "type": "string"
              },
              "@size": {
                "type": "integer",
                "minimum": 1
              },
              "@type": {
                "type": "string"
              }
            },
            "additionalProperties": false,
            "description": "Used for all free text entry elements in the schema",
            "required": []
          },
          "BxfUtcDateTime": {
            "type": "string",
            "properties": {
              "@localTimeZone": {
                "type": "string"
              }
            },
            "additionalProperties": false,
            "description": "Standard UTC Date-Time",
            "format": "date-time",
            "required": []
          },
          "EventNotes": {
            "type": "object",
            "properties": {
              "EventNote": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/bxftypes/$defs/BxfText"
                },
                "minItems": 1
              }
            },
            "additionalProperties": false,
            "description": "Operator notes used to annotate the event with reference to the person that created the note.",
            "required": [
              "EventNote"
            ]
          },
          "AsRunStatusType": {
            "type": "string",
            "enum": [
              "Aired Without Discrepancy",
              "Technical Difficulty",
              "Did not air",
              "Aired with Duration Discrepancy",
              "Aired with Content Discrepancy",
              "Preempted",
              "Joined in Progress",
              "Inserted by Operator",
              "Unknown",
              "Missing Content"
            ]
          },
          "ActionType": {
            "type": "string",
            "enum": [
              "add",
              "read",
              "remove",
              "unchanged",
              "update"
            ]
          },
          "BxfShortName": {
            "type": "string"
          },
          "BxfElementaryErrorExt": {
            "type": "string",
            "pattern": "(system_unavailable|not_supported|duplicate_message|processing_exception)(:.*)?"
          },
          "BxfElementaryError": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "$ref": "#/components/schemas/bxftypes/$defs/BxfElementaryErrorExt"
              }
            ]
          },
          "BxfError": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/bxftypes/$defs/BxfElementaryError"
            }
          },
          "BxfStatus": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "$ref": "#/components/schemas/bxftypes/$defs/BxfStatusExtType"
              }
            ]
          },
          "BxfStatusExtType": {
            "type": "string",
            "enum": [
              "warning"
            ]
          },
          "BxfUri": {
            "type": "string",
            "format": "uri"
          },
          "DayPattern": {
            "type": "string",
            "pattern": "[0,1]{7}"
          },
          "DestinationType": {
            "type": "string"
          },
          "EiCode": {
            "type": "string",
            "minLength": 7,
            "maxLength": 9,
            "pattern": "E-I [0-9]{0,1}[0-9]-[0-9]{0,1}[0-9]"
          },
          "EndModeType": {
            "type": "string",
            "enum": [
              "Duration",
              "Manual",
              "External"
            ]
          },
          "LMTLanguageType": {
            "type": "string",
            "enum": [
              "ab",
              "af",
              "ak",
              "tw",
              "sq",
              "arp",
              "am",
              "ar",
              "arq",
              "ar-BH",
              "ar-KM",
              "ar-DJ",
              "ar-ER",
              "ar-IQ",
              "ar-IL",
              "ar-JO",
              "ar-KW",
              "apc",
              "ar-LY",
              "ar-MR",
              "ary",
              "ar-OM",
              "ar-PS",
              "ar-QA",
              "ar-SA",
              "ar-SD",
              "ar-SY",
              "ar-AE",
              "aeb",
              "ar-EH",
              "ar-YE",
              "arz",
              "arb",
              "hy",
              "hyw",
              "as",
              "ay",
              "az-Latn",
              "bgq",
              "bm",
              "bnt",
              "hz",
              "ki",
              "tog",
              "toi",
              "eu",
              "be",
              "bn",
              "ber",
              "bho",
              "bi",
              "bs",
              "bg",
              "my",
              "ca",
              "ca-FR",
              "ca-ES",
              "chr",
              "zh-Hans",
              "zh-Hans",
              "zh-Hant",
              "zh-Hant-HK",
              "zh-Hant",
              "co",
              "cs",
              "da",
              "nl",
              "nl-NL",
              "vls",
              "dz",
              "en",
              "en-AU",
              "en-CA",
              "en-HK",
              "en-IE",
              "en-MY",
              "en-MS",
              "en-NZ",
              "en-CN",
              "en-SG",
              "en-ZA",
              "en-PH",
              "en-GB",
              "en-US",
              "en-001",
              "eo",
              "ekk",
              "fo",
              "fj",
              "fil",
              "fi",
              "fr",
              "fr-BE",
              "fr-CA",
              "fr-FR",
              "fr-CH",
              "fr-001",
              "frs",
              "frr",
              "fy",
