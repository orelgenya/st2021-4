asyncapi: 3.0.0
info:
  title: BXF Use Case Library
  version: 1.0.0
  description: |
    AsyncAPI catalogue derived from the SMPTE ST 2021-4 sample messages.
    Each channel groups documented use cases that share the same BXF
    messageType attribute.
defaultContentType: application/xml
servers:
  sandbox:
    host: bxf.example.test
    protocol: ws
channels:
  Information:
    address: bxf/Information
    messages:
      BxfInformationMessage:
        $ref: '#/components/messages/BxfInformationMessage'
    subscribe:
      message:
        $ref: '#/components/messages/BxfInformationMessage'
  Heartbeat:
    address: bxf/Heartbeat
    messages:
      BxfHeartbeatMessage:
        $ref: '#/components/messages/BxfHeartbeatMessage'
    subscribe:
      message:
        $ref: '#/components/messages/BxfHeartbeatMessage'
  Request:
    address: bxf/Request
    messages:
      BxfRequestMessage:
        $ref: '#/components/messages/BxfRequestMessage'
    subscribe:
      message:
        $ref: '#/components/messages/BxfRequestMessage'
  Reply:
    address: bxf/Reply
    messages:
      BxfReplyMessage:
        $ref: '#/components/messages/BxfReplyMessage'
    subscribe:
      message:
        $ref: '#/components/messages/BxfReplyMessage'
components:
  messages:
    BxfInformationMessage:
      name: Information
      summary: BXF Information message
      schemaFormat: application/schema+json;version=draft-2020-12
      payload:
        $ref: 'schema-json/bxfschema.schema.json#/$defs/BxfMessage'
      examples:
      - name: Acquisition Failure Use Case
